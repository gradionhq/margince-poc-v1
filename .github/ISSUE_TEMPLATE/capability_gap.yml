name: Capability gap or proposal
description: Behaviour the product should have and does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **What the product does today is defined by this repository** — the
        code, the tests, and `backend/api/crm.yaml`. Describe the capability you
        need and why; a maintainer decides whether it is a gap to build, a
        proposal that needs a product ruling first, or something already
        possible another way.

        Reversible product behaviour — a field, a filter, a view, a workflow —
        is normal work and needs no ceremony. A change to security, privacy,
        agent authority, auditability, public contract compatibility or
        licensing is a **guardrail** change: still workable, but it carries a
        decision record and usually a test alongside it.

  - type: textarea
    id: need
    attributes:
      label: What should be possible
      description: >-
        The capability from the point of view of whoever needs it — a user, an
        operator, or an agent acting for one of them. Describe the outcome, not
        an implementation.
      placeholder: >-
        An agent should be able to see which of its own staged 🟡 actions are
        still awaiting approval, so it can report status without polling every
        record it touched.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this
      description: >-
        Your best read. A maintainer confirms it — getting this wrong costs
        nothing.
      options:
        - Ordinary product behaviour (a field, filter, view, or workflow)
        - Touches a guardrail (security, privacy, agent authority, audit, contract compatibility, licensing)
        - A public API, MCP tool, or event contract change
        - Not sure
    validations:
      required: true

  - type: input
    id: decision-ref
    attributes:
      label: Related decision number, if you know of one
      description: >-
        A decision number, if one bears on this — the records themselves are
        not in this repository. Leave blank if none; a maintainer will find it.
      placeholder: "ADR-0055"

  - type: textarea
    id: today
    attributes:
      label: What has to be done instead today
      description: >-
        The workaround, if one exists, and what it costs. "Nothing — it is simply
        impossible" is a complete answer, and a stronger one than a vague
        estimate.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      multiple: true
      options:
        - REST API (/v1)
        - MCP tool surface (/mcp)
        - Web UI
        - CLI or operational tooling
        - Extension seam (backend/pkg, extensions/)
        - Data model or migrations
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      description: >-
        This repository is public. Everything you paste here is public
        permanently, including in the git history of edits.
      options:
        - label: >-
            No secrets, no customer or personal data, no local filesystem paths,
            and nothing quoted from a private document. Cite a decision by its
            number.
          required: true
