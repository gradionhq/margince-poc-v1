name: Release

# Draft a margince-constellation release, on manual dispatch only. The release
# lives in the constellation dist service at test.margince.com, not on GitHub —
# a constellation release is a server deployment (role images, an incremental
# patch, SBOMs) and GitHub hosts none of that.
#
# This ran on every push to main: about 400 runs a week, roughly 10 runner-
# minutes each on arm64, and three jobs drawn from the same org-wide ceiling of
# 20 concurrent runners the PR gates queue in. ci.yml already explains what that
# ceiling costs — a full-stack merge schedules 28 jobs against it, so overlapping
# lanes turn a 9-minute gate into a much longer one and starve the PR lanes
# behind them. Releasing on every commit spent that budget on a version nobody
# asked for: the repository is under heavy development and has no real releases
# yet, which is what the epoch-pinned 1970.* version says out loud. A release is
# now a decision somebody makes, which is the only cadence a dispatch can have.
#
# The desktop bundles now sit behind the `desktop` dispatch input, default OFF.
# They used to be separated from an ordinary release by the trigger itself — a
# push got the dist release, a dispatch additionally got the bundles — and with
# the push trigger gone that distinction would have collapsed, making every
# release compile Postgres from source twice for a 170 MB pair of assets nobody
# asked for. The input keeps the cheap dist-only release as the default and makes
# the bundles the deliberate act they were before. Those are something a person
# downloads and runs on their own machine, so they are attached to a GitHub
# release under the same version, and that release page is where they are browsed
# and fetched. See the jobs at the bottom of this file.
#
# The flow, in order: draft the release versioned 1970.<build> (the build is
# this workflow's run number, fitting the constellation YYYY.edition version
# scheme; the year is pinned to the epoch FOR NOW so every PoC release orders
# strictly below any real dated release) with the incremental patch and the
# three freshly generated
# source-tree SBOMs attached, then build the three role images through the
# bake file (docker-bake.hcl), push them to the constellation registry, add
# them to the draft as digest-pinned image references, and finally publish
# the release. The dist service publishes only a complete draft (patch + all
# three SBOMs), so a release that drafted without a patch stays a draft.
#
# Both the patch cut and the release upload go through the release-management
# CLI (a closed-source tool built and published from
# gradionhq/margince-constellation as a private container image), run here
# against this repo's checkout: the product source the release describes lives
# here, so the release is cut here. The upload authenticates with the dist
# publisher token (the MARGINCE_DIST_PUBLISHER_TOKEN secret — only CI holds
# it) against the dist service URL below.
#
# A dispatch carries no push range, so the patch range is HEAD~1..HEAD — the
# parent commit only, however many commits landed since the last release. That
# is a known gap, not a property worth relying on: the base belongs at the last
# PUBLISHED release, which is
# https://github.com/margince/margince/issues/1798. Until that lands, a
# dispatched release's patch describes one commit, and a consumer applying
# patches in order cannot use this stream to move forward. Nothing consumes it
# today, which is why this is recorded rather than blocking. The step below keeps
# reading github.event.before so that restoring a push trigger is a one-line
# change; under a dispatch it is always empty and the fallback always applies.
on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "Also build the macOS + Windows desktop bundles and attach them to a GitHub release"
        type: boolean
        default: false

permissions:
  contents: read

# Cancellation is scoped per JOB below rather than to the whole workflow, because
# the two halves of this flow want opposite treatment. Drafting and baking are
# superseded work — a second dispatch should not wait out a full docker bake for
# a commit nobody will consume — while publishing is a mutation of the dist
# service and must never be interrupted part-way, so it carries a group that
# serializes instead of one that cancels.
#
# The groups matter far less now that a dispatch is the only trigger: two runs
# overlap only when somebody starts a second one deliberately. They are kept
# because that case still exists and the reasoning above still holds for it.

env:
  # The release-management CLI image, published :latest from constellation's
  # main (gradionhq/margince-constellation). NOTE: since this repo moved to the
  # margince org, the job's default GITHUB_TOKEN can NO LONGER read that package
  # — it is private and owned by another organisation. A release dispatched
  # before a cross-org PAT (read:packages on gradionhq) is wired into the three
  # `docker login ghcr.io` steps below WILL FAIL at login.
  RELEASE_MANAGEMENT_IMAGE: ghcr.io/gradionhq/margince-constellation/release-management:latest
  # The dist service of the constellation deployment the release is drafted
  # into. The CLI reads this variable directly and refuses a non-https URL.
  # ONE constellation deployment exists (test.margince.com), so main and test
  # both draft into it; this becomes a per-ref selection when a production
  # constellation exists.
  MARGINCE_RELEASE_MANAGEMENT_DIST_URL: https://dist.test.margince.com

jobs:
  draft:
    name: Draft release
    timeout-minutes: 30
    # Superseded by a newer run on the same ref: the tip is the commit worth
    # drafting.
    concurrency:
      group: ${{ github.workflow }}-draft-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      # Pull the private release-management image from ghcr.io with the
      # default GITHUB_TOKEN.
      packages: read
    outputs:
      version: ${{ steps.draft.outputs.version }}
      patched: ${{ steps.draft.outputs.patched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so both ends of the range resolve; the shallow default
          # would not carry the before commit.
          fetch-depth: 0
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      # The SBOM pipeline pins its SPDX validator to linux/amd64 (its
      # dependency wheel hashes resolve for that platform), which this arm64
      # runner can only execute emulated.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      # Fresh SBOMs at the release commit, through the full pinned pipeline
      # (generate, normalize, supplement, parity, validate). The dist service
      # verifies that the SBOMs attest the bytes of every file the patch
      # produces; both are derived from the same commit, so they agree by
      # construction — the committed sboms/ may lag the tree and must not be
      # uploaded as release artifacts.
      - name: Generate the SBOMs at the release commit
        run: make sbom
      - name: Cut the patch and draft the release
        id: draft
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MARGINCE_RELEASE_MANAGEMENT_DIST_TOKEN: ${{ secrets.MARGINCE_DIST_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          # The year is pinned to the epoch, not the calendar, while the flow
          # is a PoC: a 1970.* version orders strictly below any real dated
          # release, so nothing cut here can ever shadow one.
          version="1970.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A push carries its previous tip in BEFORE; a manual dispatch carries
          # nothing, so fall back to the parent commit. Two shapes of BEFORE
          # mean there is no ancestor to diff from, and the release drafts
          # without a patch: all-zeros (branch creation), and a commit the
          # fetched history no longer reaches (a force-push discards its old
          # tip, so even a full fetch of the new tip cannot resolve it).
          # Ancestry is deliberately NOT required beyond that: a resolvable
          # BEFORE that is no ancestor of AFTER (a force-push whose old tip
          # another ref still reaches) still names the previously drafted
          # state, and the tree diff from it is exactly the increment a
          # consumer on that state needs.
          base="$BEFORE"
          if [ -z "$base" ]; then
            base="$(git rev-parse --verify HEAD~1 2>/dev/null || true)"
          fi
          patch_args=()
          # The ref name is part of the patch filename; a branch name with a
          # slash would make it a path into a directory that does not exist
          # inside the CLI's mount, so flatten the separators.
          patch_file="${GITHUB_REF_NAME//\//-}-$AFTER.patch"
          if [ -n "$base" ] && ! printf '%s' "$base" | grep -qE '^0+$' \
            && git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            # The image ENTRYPOINT is the CLI (WORKDIR /work); mount the checkout
            # there and diff it with -repo. The image's own user is non-root and
            # does not own the runner's checkout, so run as the runner's uid/gid —
            # the CLI then writes the patch as the mount's owner. That uid has no
            # passwd entry in the image, so point HOME at a writable path, and
            # inject safe.directory via git's env config (no writable config file
            # needed) for the CLI's git subprocess.
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$PWD":/work \
              -e HOME=/tmp \
              -e GIT_CONFIG_COUNT=1 \
              -e GIT_CONFIG_KEY_0=safe.directory \
              -e GIT_CONFIG_VALUE_0='*' \
              "$RELEASE_MANAGEMENT_IMAGE" \
              create-patch -from "$base" -to "$AFTER" -repo . -out "$patch_file"
            patch_args=(-patch "$patch_file")
            echo "patched=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ancestor commit to diff from; drafting the release without a patch." >&2
            echo "patched=false" >> "$GITHUB_OUTPUT"
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/work \
            -e HOME=/tmp \
            -e MARGINCE_RELEASE_MANAGEMENT_DIST_URL \
            -e MARGINCE_RELEASE_MANAGEMENT_DIST_TOKEN \
            "$RELEASE_MANAGEMENT_IMAGE" \
            draft-release -version "$version" -revision "$AFTER" "${patch_args[@]}" \
            -sbom-cyclonedx sboms/margince.cdx.json \
            -sbom-spdx22 sboms/margince.spdx221.json \
            -sbom-spdx30 sboms/margince.spdx300.json

  # Build the three role images through the bake file (docker-bake.hcl), push
  # them to ghcr, and add all three to the drafted release in ONE add-artifacts
  # call, each as a digest-pinned reference (the digest is the identity; the
  # version tag is recorded for humans). A release needs every role, so the
  # images land in the draft together or not at all.
  #
  # `docker-image`, not `image`: the check-image-pins gate key-anchors every
  # `image:` in a workflow as a container reference to digest-check, and that
  # includes a job id.
  docker-image:
    name: Build docker container
    timeout-minutes: 60
    needs: [draft]
    # The long half — and the reason cancellation is here at all. A bake for a
    # commit the tip has already replaced is work nobody reads.
    concurrency:
      group: ${{ github.workflow }}-bake-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      # Pull the private release-management image from ghcr.io; the baked
      # images push to the constellation registry, not ghcr.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # qemu runs the foreign runtime layers of the multi-platform bake; the
      # builder stages cross-compile on the native platform (the Dockerfiles
      # pin their builders to $BUILDPLATFORM).
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      # The docker-container driver: with the default docker driver the bake
      # metadata file carries no pushed-manifest digest, and the digest is
      # exactly what the release records.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # The runner is ephemeral, so every bake would otherwise start cold. Two
      # caches bridge the runs, and they cover different things:
      #   - CACHE=gha (docker-bake.hcl) exports the LAYER cache — its one
      #     durable win is the dependency-download layer, which only busts
      #     when a module pin changes. This step exposes the Actions cache
      #     credentials buildx needs for type=gha.
      #   - The cache MOUNTS (the Go compile cache, the pnpm store, corepack's
      #     pnpm download, tsc's .tsbuildinfo) are not layers and no layer
      #     cache carries them; actions/cache + buildkit-cache-dance below
      #     save and restore their contents around the bake.
      #
      # Both cache steps carry continue-on-error: they only make the bake
      # faster, so a cache-service outage or a broken injection must cost this
      # run a cold bake, never the release. The bake and publish steps after
      # them stay fatal.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Restore the BuildKit cache-mount contents
        id: mount-cache
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .buildx-mount-cache
          # Keyed by commit so every run saves its (grown) caches; the
          # restore-key makes any previous run's save the starting point.
          key: buildx-mounts-${{ github.sha }}
          restore-keys: |
            buildx-mounts-
      - name: Inject the cache-mount contents into the builder
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          utility-image: ghcr.io/containerd/busybox:1.36@sha256:7b3ccabffc97de872a30dfd234fd972a66d247c8cfc69b0550f276481852627c
          cache-map: |
            {
              ".buildx-mount-cache/go-build": { "target": "/root/.cache/go-build", "id": "margince-gobuild" },
              ".buildx-mount-cache/pnpm-store": { "target": "/pnpm-store", "id": "margince-pnpm-store" },
              ".buildx-mount-cache/tsbuildinfo": { "target": "/app/frontend/node_modules/.tmp", "id": "margince-tsbuildinfo" },
              ".buildx-mount-cache/corepack": { "target": "/root/.cache/node/corepack", "id": "margince-corepack" }
            }
          skip-extraction: ${{ steps.mount-cache.outputs.cache-hit }}
      # ghcr only for pulling the private release-management CLI image; the
      # baked images go to the constellation registry, authenticated as the
      # registry publisher (the token-auth realm's reserved identity, whose
      # grant admits push on margince/*).
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Log in to the constellation registry
        env:
          PUBLISHER_TOKEN: ${{ secrets.MARGINCE_AUTH_PUBLISHER_TOKEN }}
        run: echo "$PUBLISHER_TOKEN" | docker login registry.test.margince.com -u _publisher --password-stdin
      - name: Bake and push the images, add them to the draft
        env:
          REPO: registry.test.margince.com/margince
          VERSION: ${{ needs.draft.outputs.version }}
          PLATFORMS: linux/amd64,linux/arm64
          CACHE: gha
          MARGINCE_BUILD_REVISION: ${{ github.sha }}
          MARGINCE_RELEASE_MANAGEMENT_DIST_TOKEN: ${{ secrets.MARGINCE_DIST_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          docker buildx bake --push \
             --provenance "mode=max" \
             --metadata-file bake-metadata.json
          images=()
          for role in api web worker; do
            digest="$(jq -er --arg role "$role" '.[$role]."containerimage.digest"' bake-metadata.json)"
            images+=(-image "$role=$REPO/$role:$VERSION@$digest")
          done
          docker run --rm \
            -e MARGINCE_RELEASE_MANAGEMENT_DIST_URL \
            -e MARGINCE_RELEASE_MANAGEMENT_DIST_TOKEN \
            "$RELEASE_MANAGEMENT_IMAGE" \
            add-artifacts -version "$VERSION" "${images[@]}"

  # Publish only after the images are attached, so a published release always
  # carries its images even though the dist completeness gate only requires
  # the patch and the SBOMs. A release that drafted without a patch cannot
  # pass that gate, so it deliberately stays a draft (the degenerate
  # branch-creation/force-push case).
  publish:
    name: Publish release
    timeout-minutes: 30
    needs: [draft, docker-image]
    # `cancel-in-progress: false` here and nowhere else: publishing mutates the
    # dist service, so a publish that has started always finishes. The group
    # bounds how many can be in flight — one publish at a time per ref, and a
    # publish still pending when a newer one arrives gives up its place. It is a
    # mutual exclusion, not an ordering: which version reaches the dist service
    # first is not something a concurrency group can decide.
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    # `!= 'false'`, not `== 'true'`: on a re-run of failed jobs the draft job
    # does not re-execute and GitHub drops its outputs, so an equality test
    # against 'true' silently skipped the publish of a fully patched release.
    # Fail open on a missing output — the only release that must not publish
    # is one that KNOWS it has no patch, and the dist completeness gate backs
    # this up server-side with a 409. The implicit success() still applies, so
    # a failed draft or image job keeps blocking the publish.
    if: needs.draft.outputs.patched != 'false'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      # Pull the private release-management image from ghcr.io with the
      # default GITHUB_TOKEN.
      packages: read
    steps:
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish the release
        env:
          VERSION: ${{ needs.draft.outputs.version }}
          MARGINCE_RELEASE_MANAGEMENT_DIST_TOKEN: ${{ secrets.MARGINCE_DIST_PUBLISHER_TOKEN }}
        run: |
          docker run --rm \
            -e MARGINCE_RELEASE_MANAGEMENT_DIST_URL \
            -e MARGINCE_RELEASE_MANAGEMENT_DIST_TOKEN \
            "$RELEASE_MANAGEMENT_IMAGE" \
            publish-release -version "$VERSION"

  # ---------------------------------------------------------------------------
  # The downloadable desktop bundles, and the GitHub release that holds them.
  #
  # GATED ON THE `desktop` DISPATCH INPUT, default OFF. A macOS and a Windows
  # bundle each compile Postgres from source, so these are much the most
  # expensive jobs in the file and produce a 170 MB pair of assets. What used to
  # separate them from an ordinary release was the trigger — a push got the dist
  # release, a dispatch also got the bundles — and that separation had to move
  # somewhere when the push trigger went away, or every release would pay for
  # them. `github.event_name == 'workflow_dispatch'` would now be true always,
  # which is why it is not the guard any more.
  #
  # All three share the one input deliberately: github-release needs both build
  # jobs, and a skipped `needs` skips it too, so the GitHub release appears
  # exactly when the bundles it would hold do.
  #
  # Both lanes are REUSED, not copied: desktop-macos.yml and desktop-windows.yml
  # are the same workflows the pull-request check runs, called here through
  # workflow_call. A second copy of the build would drift from the one that gates
  # the merge, and that drift surfaces as a release bundle behaving differently
  # from the bundle CI blessed — the worst place to find it.
  desktop-macos:
    name: Build the macOS bundle
    if: inputs.desktop
    needs: [draft]
    uses: ./.github/workflows/desktop-macos.yml
    permissions:
      contents: read
    with:
      # The exact commit the release describes, not a branch that may have moved
      # since the draft job read it.
      ref: ${{ github.sha }}
      version: ${{ needs.draft.outputs.version }}

  desktop-windows:
    name: Build the Windows bundle
    if: inputs.desktop
    needs: [draft]
    uses: ./.github/workflows/desktop-windows.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.draft.outputs.version }}

  # Create the GitHub release and attach both bundles.
  #
  # Deliberately NOT downstream of `publish`. The dist service's completeness
  # gate is about the patch and the SBOMs — nothing to do with whether a desktop
  # folder built — so making the download wait on it would let a dist-side
  # failure withhold bundles that already exist and are already correct.
  #
  # Marked a prerelease for the same reason the version is epoch-pinned above: a
  # 1970.* build must not present itself as the latest release of the product.
  github-release:
    name: Publish the GitHub release
    if: inputs.desktop
    needs: [draft, desktop-macos, desktop-windows]
    runs-on: ubuntu-24.04-arm
    # Transfer work, not build work: the bundles were already produced inside
    # the desktop lanes' own 90-minute ceilings, and this job only moves them —
    # two artifact downloads, one re-zip, one release upload. That is the same
    # shape as `draft` and `publish` above, which carry 30 for the same reason.
    # If a desktop bundle ever grows past what 30 minutes of artifact transfer
    # can carry, this moves with the sibling two rather than on its own.
    timeout-minutes: 30
    permissions:
      # The only job in this workflow that writes to this repository, and it
      # writes exactly one thing: the release and its tag. Every other job here
      # is read-only.
      contents: write
    steps:
      # Re-running only the FAILED jobs does not re-execute `draft`, and GitHub
      # drops the outputs of a job that did not run — the same trap the publish
      # job's `!= 'false'` guards against. An empty version would otherwise
      # surface as a download-artifact error naming an artifact called
      # "margince-macos-", which says nothing about the cause.
      - name: Require the release version
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "The draft job reported no version. That happens when only the failed" >&2
            echo "jobs were re-run: draft did not re-execute and GitHub dropped its" >&2
            echo "outputs. Re-run ALL jobs so the release is drafted again." >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: margince-macos-${{ needs.draft.outputs.version }}
          path: assets
      # The Windows lane uploads the FOLDER. upload-artifact zips it in transit
      # and download-artifact expands it again, so what lands here is a tree and
      # not an archive, and it has to be re-zipped to become one release asset.
      # Downloading it INTO a directory of that name is what gives the zip a
      # self-describing top-level folder instead of scattering into wherever the
      # user unzipped. The macOS lane already ships a tarball, because tar is
      # what preserves the executable bit an artifact upload drops.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: margince-windows-${{ needs.draft.outputs.version }}
          path: windows/margince-windows
      - name: Name the assets after the release
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          set -euo pipefail
          mv "assets/margince-macos.tar.gz" "assets/margince-macos-$VERSION.tar.gz"
          (cd windows && zip -qr "../assets/margince-windows-$VERSION.zip" margince-windows)
          ls -l assets
          # An asset that uploaded but is empty is indistinguishable from a
          # working download until somebody opens it.
          for f in assets/*; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f is empty" >&2
              exit 1
            fi
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.draft.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The first-launch step belongs HERE and not only in the docs. This
          # page is where the download happens, and the OS refuses both bundles
          # on first launch for want of a paid signing identity — a user who has
          # to go looking for that reads it as the build being broken.
          #
          # A QUOTED heredoc, so the backticks and brackets below stay literal
          # rather than being read as command substitution, with @VERSION@
          # substituted afterwards.
          cat > notes.md <<'NOTES'
          Self-contained desktop builds. Download one folder, start it, and use Margince
          in your browser — no Docker and no prerequisites.

          | | macOS | Windows |
          |---|---|---|
          | Asset | `margince-macos-@VERSION@.tar.gz` | `margince-windows-@VERSION@.zip` |
          | Runs on | macOS 12 Monterey or newer, **Apple silicon** | Windows 10 or newer, x64 |
          | Also needed | Nothing | [Microsoft Visual C++ x64 redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe) |
          | Unpack to | A **short** path such as `~/Margince` — the database socket has a 103-byte limit | Anywhere |

          **The first launch warns once.** Neither build is signed for distribution:
          that needs a paid Apple Developer ID and an Authenticode certificate.

          - **macOS** — right-click `Start Margince.command` → **Open** → **Open**.
            One dialog and no more: the bundle clears the download quarantine from
            its own programs, so macOS does not ask again for each of Postgres, the
            event bus, the api and the worker as they start.
          - **Windows** — SmartScreen shows a warning: **More info** → **Run anyway**.

          It prints the address, opens your browser, and prints the generated admin
          password on the first launch only. After that the only copy is in
          `data/admin-password` inside the folder.

          Configuration, updating in place, and troubleshooting:
          [docs/how-to/build-the-desktop-app.md](https://github.com/margince/margince/blob/main/docs/how-to/build-the-desktop-app.md)
          NOTES
          sed -i "s/@VERSION@/$VERSION/g" notes.md
          printf '\nRevision: %s\n' "$REVISION" >> notes.md
          gh release create "$VERSION" \
            --target "$REVISION" \
            --title "Margince $VERSION" \
            --notes-file notes.md \
            --prerelease \
            assets/*
