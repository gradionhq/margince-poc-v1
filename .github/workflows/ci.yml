# The merge gate as CI (security review M1/M2): `make check` alone runs
# only the no-database lane, so the tenant-isolation and GDPR-erasure
# fitness tests — which are `//go:build integration` and need a real
# Postgres — never blocked a PR. This pipeline runs BOTH lanes plus the
# pinned vulnerability scan, the deterministic craftsmanship gate, and the
# frontend lane as required checks, so a migration that forgets FORCE RLS,
# an erasure that misses a PII table, a vulnerable dependency, a swallowed
# error, or a UI regression fails the merge instead of shipping.
#
# Job names follow the craftsmanship wiring (ADR-0045,
# cli/craft/wiring): external/fork PRs hit the same dco + deterministic-gates
# + craftsmanship + craft-residue jobs as internal work, and craftsmanship
# runs only after the deterministic gates are green.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue builds `main + everything ahead in the queue + this entry` on
  # a throwaway ref and gates THAT tree, before it lands. This is the merge
  # verdict, and it is why there is no `push: [main]` trigger here: a push to main
  # is the RECORD of a verdict already reached, not an occasion to reach one.
  merge_group:
  workflow_dispatch:

# ONE live run per pull request; a new push supersedes the review in flight.
#
# There is no main-push lane to reason about any more. The merge queue gates the
# tree before it lands (`merge_group` above), so every commit on main arrives with
# a verdict already attached. Each queue entry gets its own throwaway ref, so
# entries never collide in this group, and cancel-in-progress narrows to pull
# requests so a merge verdict can never be cancelled.
#
# What this replaces, and why it could not stay: a group keyed on `github.ref`
# with cancellation across ALL events meant a push to main cancelled the RUNNING
# main lane. At this repository's merge velocity 64% of main pushes were
# cancelled, and the survivors were mostly classifier skips averaging 4.5 minutes
# against a real lane's 16 — so roughly one main commit in twenty-five was ever
# gated, and "main is green" was a statement about almost nothing. The argument
# that used to live here traded per-commit gating away to keep the tip's verdict
# fast, on the grounds that 28 jobs against a 20-concurrent ceiling made the
# alternative unaffordable. The ceiling moved, and the invariant it bought —
# main's tip is always the gated commit — is contradicted by the run history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR lanes still supersede themselves: a new push obsoletes the review in
  # flight. A merge_group run must never be cancelled — it IS the merge verdict,
  # and each queue entry has its own throwaway ref anyway, so the group would not
  # collide. Saying so explicitly beats relying on that.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  # Classify the diff so a change runs only the checks it can affect — a
  # frontend-only PR skips the Go build/gate + the integration shard fleet, a
  # backend-only PR skips the frontend + UAT lanes, and a docs-only PR skips
  # everything. Draft PRs run nothing until marked ready (the swarm pushes many
  # WIP commits). A required job skipped this way counts as passing.
  #   backend  = Go/DB + the gate inputs (backend, infra, go.work, Makefile,
  #              scripts, this workflow, AGENTS.md) — gates the Go build/gate,
  #              craft, integration, vuln. A gate input earns its place by
  #              being able to change what a gate DOES; prose that merely
  #              describes one does not, hence the two extglobs below.
  #   frontend = frontend/ + backend/api (the contract drives FE types) —
  #              gates the frontend lane + UAT
  #   e2e      = backend/ + frontend/ + infra — gates the full-stack live-boot
  changes:
    name: changes
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Diff-scoping is honest for author feedback and dishonest as a merge
      # verdict: on a push, a commit matching no scope skipped every gate and
      # GitHub reported green. On the merge queue every scope is therefore true
      # and the lane is full-tree. The classifier still RUNS there — its filter
      # step is cheap — and its answer is merely overridden, so a reader sees the
      # real diff in the log next to the reason it was ignored.
      #
      # The `== 'true'` on each is load-bearing. paths-filter emits the STRING
      # `true`/`false`, and `||` in a GitHub expression coalesces on falsiness,
      # where the non-empty string "false" is TRUTHY. Without the comparison every
      # output would be the string "false" and read as truthy by every consumer:
      # every job would run on every event, which looks like it works.
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'merge_group' }}
      # The database-bearing subset of `backend`. See the filter below for why
      # the two differ, and by exactly what.
      backend_db: ${{ steps.filter.outputs.backend_db == 'true' || github.event_name == 'merge_group' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'merge_group' }}
      e2e: ${{ steps.filter.outputs.e2e == 'true' || github.event_name == 'merge_group' }}
      deps: ${{ steps.filter.outputs.deps == 'true' || github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # `backend_db` is every path that can change what a DATABASE-backed
            # lane proves; `backend` is that set PLUS the agent rulebooks, which
            # a Go unit test reads and no integration test does. The anchor makes
            # the second derive from the first — two hand-maintained copies of
            # one list is the shape this repo refuses everywhere else, and it
            # would rot in the direction that silently under-tests.
            #
            # The split exists because one flag was driving two unrelated
            # things: run the Go unit gates, and boot the Postgres shards.
            # A rulebook edit needs the first and cannot affect the second —
            # the same reasoning already applied to `infra/**/!(*.md)` below,
            # applied to the last two entries as well.
            backend_db: &backend_db
              - 'backend/**'
              # The MCP App admission vocabulary is AUTHORED under frontend/ and
              # copied into the Go package, where a byte-equality test gates the
              # copy. Without this line a PR editing only the authored file is
              # classified frontend-only, the backend lane never runs, and the
              # api ships enforcing the previous rules — which is exactly the
              # "two validators that disagree" outage the shared file exists to
              # make impossible.
              - 'frontend/src/mcp-apps/forbidden.json'
              # The dev compose stack the DB-backed lanes boot — but not the
              # prose beside it. Editing infra/ci-pipeline.md, the file that
              # DOCUMENTS this classifier, must not boot the Postgres
              # shards. The extglob is one positive pattern on purpose: the
              # action ORs its patterns, so a `!infra/**/*.md` entry would
              # match every path OUTSIDE infra/ and fire the filter on
              # everything.
              - 'infra/**/!(*.md)'
              - 'go.work'
              - 'go.work.sum'
              - 'Makefile'
              - 'scripts/**'
              - 'extensions/**'
              - 'fixtures/**'
              - 'composition/**'
              # Only the merge gate itself. release.yml and sbom.yml run no
              # backend gate, so editing one cannot invalidate a gate result —
              # and each proves itself when it runs.
              #
              # The gate is three files now: this caller plus the lane workflows
              # it invokes. The lanes are globbed rather than named one by one so
              # a lane added later is covered the day it is committed — the same
              # reason the classifier's other scopes are derived rather than
              # listed, and the difference between a scope that stays honest and
              # one that silently stops covering a new file.
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lane-*.yml'
              # The composite actions ci.yml calls. go-build-cache decides what
              # every Go job restores, so an edit to it changes what the gates
              # compile — the same claim on this scope that ci.yml itself has.
              - '.github/actions/**'
              - 'sonar-project.properties'
            # The rulebooks. `backend/agentsdocparity_test.go` reads BOTH and
            # fails when the three shared sections drift, so a unit lane has to
            # run for either — but no integration test opens them, so the
            # Postgres shards do not.
            #
            # CLAUDE.md was absent from this classifier entirely until now,
            # which meant an edit to it alone ran no Go lane at all and could
            # break that parity test with nothing to catch it. Listing it here
            # is the fix for that, not a convenience.
            backend:
              - *backend_db
              - 'AGENTS.md'
              - 'CLAUDE.md'
            frontend:
              - 'frontend/**'
              - 'backend/api/**'
              # The frontend job runs BOTH SPA lanes (ADR-0069), and the
              # composed one is derived from inputs that live nowhere near
              # frontend/. A unit's api/ fragment is the ONLY thing that changes
              # the composed registry and the merged contract the typed client
              # is parameterised by — without these four entries a PR that adds
              # or edits a fragment skips this job entirely, which is a lane
              # skipping generation and passing silently: exactly the failure
              # mode the composed lane exists to catch.
              - 'extensions/**'
              - 'fixtures/**'
              - 'composition/**'
              - 'backend/tools/gen-composition/**'
              # And the Makefile, because the frontend GATE lives there:
              # check-fe and fe-typecheck-composed are make targets, so a PR
              # that edits what the lane does — and nothing else — would skip
              # the lane that runs it.
              - 'Makefile'
              # And the install inputs, because they decide WHICH code the lane
              # would have run against. A lockfile bump or a pnpm override swaps
              # the dependency the SPA builds on and the one openapi-typescript
              # parses the contract with — every frontend job would skip, and a
              # dependency change is exactly the kind that needs fe-drift,
              # fe-unit and fe-bundle to have an opinion. pnpm-workspace.yaml is
              # named because `overrides` lives there: it resolves versions the
              # lockfile then merely records.
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            e2e:
              - 'backend/**'
              - 'frontend/**'
              # Same cut as the backend scope: the compose stack, not the prose.
              - 'infra/**/!(*.md)'
              # live-boot boots COMPOSED (ADR-0069): the enabled extension
              # tree and the composition inputs shape the binary under test.
              - 'extensions/**'
              - 'fixtures/**'
              - 'composition/**'
            # Everything that can change WHICH packages are in the tree, and
            # therefore which licenses the gate below judges. `**/pnpm-lock.yaml`
            # is globbed on purpose: a Renovate lockfile-only PR is precisely
            # where new transitive packages (and their licenses) enter, and it
            # must not slip past unscanned. The pattern predates the pnpm
            # workspace root moving to the repository root — the lockfile is
            # /pnpm-lock.yaml now, which `**/` still matches because it matches
            # zero segments, so this keeps firing and needs no edit next time the
            # workspace moves.
            deps:
              - 'go.work'
              - 'go.work.sum'
              - '**/go.mod'
              - '**/go.sum'
              - '**/package.json'
              - '**/pnpm-lock.yaml'
              # `overrides` lives here, so this file decides resolved versions
              # the same way a manifest does — the SBOM and licence lanes must
              # see a change to it even when nothing else moves.
              - 'pnpm-workspace.yaml'
              - '.syft.yaml'
              - '.grant.yaml'
              - 'sbom-schemas/**'
              - 'Makefile'
              # EVERY workflow, not just this one. syft catalogs a `uses:` as a
              # package, so any workflow that gains a reference changes what the
              # license gate judges — a pinned remote action brings its license,
              # and a `uses:` of a local reusable workflow brings none at all.
              # `.github/actions/**` was already here for the composite-action
              # case, and the story below is why: the same catalog entry arrived
              # from a path this filter did not name, and turned the gate red the
              # same way.
              #
              # Omitting .github/actions/** is how .github/actions/go-build-cache
              # reached main unscanned and left the gate latently red for the next
              # dependency PR.
              - '.github/workflows/**'
              - '.github/actions/**'

  # Every commit that merges carries a Developer Certificate of Origin sign-off.
  #
  # This runs on the merge queue as well as on the pull request, and the queue is
  # the one that counts: the merge_group payload carries base_sha/head_sha of the
  # tree that is about to land, so the sign-off is checked against what actually
  # merges. The alternative — exempting a pull_request-only job from the aggregate
  # verdict, which refuses a skip on merge_group — would have reopened the
  # skip-as-pass hole for the one gate that proves provenance.
  #
  # History predating this gate is not retro-required.
  dco:
    name: dco
    timeout-minutes: 20
    if: >-
      github.event_name == 'merge_group'
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every merging commit is signed off (DCO)
        working-directory: .
        env:
          # `||` coalesces on falsiness, and the unselected event's payload is
          # empty — so each var takes whichever event actually fired.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  # The deterministic merge gate: build, vet, lint (baseline + new-code
  # strict), arch-lint, unit + root fitness tests (incl. audit_log enum
  # coherence and the contract $ref pre-flight), generated-drift, and the
  # script gates (image pins, contract breaking, test lanes, file length, RLS
  # store-path, jurisdiction isolation).
  deterministic-gates:
    name: deterministic-gates
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The contract-breaking gate and the strict lint's
          # new-from-merge-base both diff against origin/main — a shallow
          # checkout has no base ref and would silently disarm them.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The shared Go build cache (see .github/actions/go-build-cache): this job
      # compiles the untagged tree twice over — `go build ./...` plus the unit
      # test binaries — and is the natural writer of the `plain` flavour every
      # other untagged Go job reads.
      - name: Restore the Go build cache
        id: go-cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      # Cache the compiled gate binaries. `make tools` compiles golangci-lint,
      # go-arch-lint, govulncheck, and oasdiff from source into ~/go/bin — ~75s
      # that setup-go's module/build cache does not cover (it caches ~/go/pkg/mod
      # and ~/.cache/go-build, not installed binaries). The pinned versions live
      # in backend/Makefile and the Go toolchain version — which `go install`
      # embeds in every binary, so a bump makes it reject and recompile the
      # cached tools — lives in backend/go.mod, so the key hashes both: a change
      # to either reseeds, otherwise a hit skips the compile. arch is in the key
      # so a binary built for one runner CPU is never restored onto another.
      - name: Cache the gate binaries
        id: gate-binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: gate-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.mod', 'backend/Makefile') }}
      # golangci-lint's analysis cache (~/.cache/golangci-lint) is separate
      # from Go's build cache, so without this it recomputes the whole repo
      # every run — the two lint passes (baseline + strict) were the largest
      # slice of this job. The key ends in the commit SHA so every run saves
      # its refreshed cache; restore-keys matches the newest prior run with
      # the same dependency/config prefix, so a PR pays analysis only for
      # the packages it touched. A toolchain, dependency, or lint-config
      # change shifts the prefix and starts clean — go.mod is in the hash
      # because a toolchain bump changes analysis results without
      # necessarily touching go.sum. The golangci version pin (in
      # backend/Makefile) is deliberately NOT in the key: golangci versions
      # its cache entries internally, and hashing the whole Makefile went
      # cold on every unrelated Makefile edit.
      - name: Cache the golangci-lint analysis cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-analysis-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', 'backend/.golangci.yml', 'backend/.golangci.strict.yml') }}-${{ github.sha }}
          restore-keys: |
            golangci-analysis-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', 'backend/.golangci.yml', 'backend/.golangci.strict.yml') }}-
      # Install the pinned gate binaries (golangci-lint, go-arch-lint, oasdiff) so
      # `make check` runs golangci and the oasdiff contract gate itself — one run
      # of every gate, instead of the golangci-lint-action + per-gate steps that
      # `make check` then re-ran as its prerequisites. Skipped entirely on a
      # cache hit: the key hashes the pinned versions (backend/Makefile) and
      # the toolchain (backend/go.mod), so a hit proves the binaries current —
      # and `go install ...@version` would NOT short-circuit on an existing
      # binary; it recomputes the whole build against a cold build cache
      # (~75s), since setup-go's caches are keyed to the product module, not
      # the tools' dependency graphs. The PATH export runs regardless.
      - name: Install the pinned gate binaries
        if: steps.gate-binaries.outputs.cache-hit != 'true'
        working-directory: .
        run: make tools
      - name: Gate binaries onto PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # The backend half of the merge gate in one pass:
      # check-craft-doc, image pins, contract-breaking, migration-versions,
      # test-lanes, file-length,
      # RLS store-path, jurisdiction isolation, then the backend gate (build,
      # vet, lint, arch-lint, unit + fitness tests, contract drift). The frontend
      # half (`make check-fe`) is the separate `frontend` job — no toolchain
      # duplication. `make check` = check-backend + check-fe locally.
      - name: Backend merge gate (make check-backend)
        working-directory: .
        env:
          # In CI a missing base ref is a broken checkout, never a skip.
          CONTRACT_BREAKING_REQUIRE_BASE: "1"
          MIGRATION_VERSIONS_REQUIRE_BASE: "1"
          # A migration baseline consolidation reuses a namespace's lowest
          # versions under new names, which check-migration-versions.sh cannot
          # tell from the collision outage it exists to report. This declares
          # that it may happen; the script decides whether it DID, per namespace,
          # by requiring the tree and the base to share no version at all.
          #
          # Safe to leave here. Once a consolidation merges, the base IS the
          # baseline and every version keeps its name, so the script refuses the
          # declaration and the gate enforces again — it goes inert on its own
          # rather than waiting for somebody to remember to delete this line.
          MIGRATION_VERSIONS_BASELINE_RESET: "1"
        run: make check-backend

  # The composed-build lane (ADR-0069): materialize the walking-skeleton
  # reference extension into extensions/, compose, and run the backend
  # build + unit lane against the composed workspace — the continuous
  # proof that an enabled extension composes without touching an
  # upstream-owned file, plus the extension's own test lane the way a
  # fork's CI would run it. deterministic-gates covers the vanilla
  # composition (empty set) via the same make targets.
  extension-reference:
    name: extension-reference
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: this job runs the backend unit lane, which includes
          # the RBAC legacy-cohort gates. Those derive the initial commit's
          # object vocabulary and grants by reading 2cb50021 — a fixture the
          # migration replay seeds from, so it must not be hand-editable. They
          # FAIL on a shallow checkout rather than degrading to an empty cohort,
          # because a gate that quietly checks nothing looks exactly like a
          # passing one.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Reads the `plain` flavour: this lane builds the untagged tree twice (once
      # with extensions/ emptied, once composed), so it is the biggest single
      # beneficiary after the shards.
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      # working-directory: . on the root-level steps — the workflow default
      # (backend) would resolve fixtures/ and extensions/ under backend/.
      #
      # The EMPTY installation stays a supported, proven state: with the
      # tracked first-party units (extensions/de) moved aside, the
      # composed wiring must be byte-identical to the committed vanilla
      # stub and the composed build must pass — otherwise a regression
      # that only breaks "remove the directory to disable" could merge,
      # since the normal gates always see {de}.
      - name: Vanilla lane (empty extensions/)
        working-directory: .
        run: |
          stash="$RUNNER_TEMP/ext-stash"
          mkdir -p "$stash"
          find extensions -mindepth 1 -maxdepth 1 -type d -exec mv {} "$stash"/ \;
          make -C backend composition build
          cmp build/composition/backend/extensions_gen.go composition/extensions_gen.go
          find "$stash" -mindepth 1 -maxdepth 1 -exec mv {} extensions/ \;
      - name: Enable the reference extension
        working-directory: .
        run: cp -R fixtures/extensions/crm-hello extensions/
      - name: Composed build + unit lane
        working-directory: .
        run: make -C backend build test check-composition
      # Tree-derived: every enabled unit's own module lane (the committed
      # first-party extensions AND the copied-in reference fixture). The
      # same run emits the merged coverage profile the sonarcloud job
      # consumes — extension units are their own modules, unreachable by
      # the shard profiles, and this job runs PARALLEL to the shard
      # fleet, so coverage costs no extra test run and no fan-in latency.
      - name: Extension self-test lanes (+ coverage)
        working-directory: .
        run: make -C backend test-extensions EXT_COVER_OUT="$PWD/backend/coverage-extensions.out"
      - name: Upload extension coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage-extensions
          path: backend/coverage-extensions.out
          if-no-files-found: ignore

  # The code-craftsmanship gate (ADR-0045) runs only after the deterministic
  # gates are green — a red build must never be judged on style.
  craftsmanship:
    name: craftsmanship
    timeout-minutes: 20
    needs: [deterministic-gates, changes]
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: craft static (strict — blocker + major)
        working-directory: .
        run: make craft-static

  # No unresolved review-loop markers (CRAFT-FIX / CRAFT-DISPUTE) reach main.
  craft-residue:
    name: craft-residue
    timeout-minutes: 20
    # Runs on every non-draft change (docs included) so a leaked
    # CRAFT-FIX/CRAFT-DISPUTE marker in any file fails the merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: craft residue
        working-directory: .
        run: make craft-residue

  # No hardcoded credential reaches main. gitleaks runs here, in the repo,
  # rather than through a hosted scanner: the policy is .gitleaks.toml, so an
  # exemption is argued for in the pull request that needs it and the same
  # `make secret-scan` reproduces this verdict on a laptop. A scanner whose
  # exclusions live in a dashboard cannot be reviewed, and drifted from the
  # list committed here until it flagged fixtures the repo already declared fake.
  secret-scan:
    name: secret-scan
    timeout-minutes: 20
    # Every non-draft change, docs included: a credential can be pasted into
    # any file type, so this cannot hang off the diff classifier. Same
    # exception craft-residue takes.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No install step: scripts/gitleaks-pin.sh fetches the version- and
      # checksum-pinned binary itself, so this job runs the scanner an engineer
      # runs, resolved by the same code. The official gitleaks action is
      # deliberately not used — it needs a paid licence key for organization
      # repositories, and this gate must stay free of one.
      - name: secret scan
        working-directory: .
        run: make secret-scan
      # The policy is only trustworthy with this beside it: an allowlist that
      # grew too broad reports "no leaks found" exactly like a clean tree.
      - name: the gate still catches
        working-directory: .
        run: make test-secret-scan
      # Beside the secret gate because it is the same class of failure: a
      # bootstrap credential written onto a provisioned installation is
      # invisible, and the entrypoint runs where nobody is watching.
      - name: the entrypoint writes no credential onto a live installation
        working-directory: .
        run: make test-api-entrypoint
      # Same class of silent failure: a dev stack that ignored MARGINCE_DSN
      # looked exactly like one that honoured it, and a slugged stack that took
      # its database name from a supplied DSN looks isolated while sharing one.
      - name: the dev stack resolves DSNs the way the product does
        working-directory: .
        run: make test-dev-dsn
      # The pin gate rides along here, and only here, because it reads the WHOLE
      # workflow directory while the backend scope names one file: sbom.yml and
      # patch.yml match no scope, so gated on the classifier this check would
      # skip on exactly the PR that unpins an action — and Renovate, which bumps
      # `uses:` across all three workflows, auto-merges on green. Same reason the
      # two gates above run unconditionally: supply-chain surface is not a scope.
      # `make check-backend` keeps running it too, so a laptop `make check`
      # reproduces this verdict. Pure bash and grep — no toolchain to install.
      - name: Action and image pins
        working-directory: .
        run: make check-image-pins

      # The dev stack's published host ports stay below the ephemeral floor.
      # This one is cheap here and expensive anywhere else: a port inside the
      # kernel's ephemeral range loses its bind to an unrelated process's client
      # port only sometimes, so the failure it prevents arrives as a `make db-up`
      # flake in a job that had nothing to do with ports. Same shape as the pins
      # above — pure bash, no toolchain, and `make check-backend` runs it too.
      - name: Dev-stack host ports
        working-directory: .
        run: make check-host-ports

  # The real-Postgres lane. Its jobs live in
  # .github/workflows/_lane-integration.yml — the shard matrix, the unit-coverage
  # pass and the fan-in that reconciles them — because that cluster was a third of
  # this file and none of it is edited when the merge gate changes.
  #
  # The lane itself carries no conditional: this call site owns the decision,
  # which is what makes `needs.integration.result == 'skipped'` mean "the caller
  # skipped the whole lane" rather than "something inside it quietly did not run".
  #
  # backend_db, not backend: this is the many-Postgres lane, and the two paths
  # that differ (the agent rulebooks) cannot change what it proves. The whole
  # cluster moves together now — previously the unit-coverage pass hung off the
  # wider `backend` scope, so a rulebook-only change ran it and then discarded its
  # pods, because the fan-in that consumes them had skipped.
  #
  # Runs in parallel with the Go gate, not behind it: gating the longest lane on
  # the build gate serialized the two slowest jobs and dominated PR wall-clock.
  integration:
    needs: [changes]
    if: needs.changes.outputs.backend_db == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/_lane-integration.yml

  vuln:
    name: govulncheck
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # govulncheck type-checks and builds every package to trace reachability,
      # so it pays the same cold compile the merge gate does.
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      - run: make vuln

  # The dependency-license gate, and the reason it lives HERE rather than in
  # sbom.yml: it is a GATE, and sbom.yml is an artifact producer. sbom.yml filters
  # at the WORKFLOW level, so on a PR touching no dependency it produces no check
  # run at all — and a required context that never posts blocks the merge forever
  # (the same trap the sonarcloud job below is written to avoid). Gated at the JOB
  # level like every other lane here, a path skip reports as passing instead.
  #
  # Runs on the merge queue as well as the pull request. It was pull_request-only
  # while main was gated by a push, because the identical gate runs inside sbom.yml
  # on main — where it is the precondition for signing: a keyless signature lands
  # permanently in a public transparency log and cannot be retracted, so a
  # policy-failing SBOM must never reach the sign job. Splitting the events ran the
  # gate once per path instead of twice.
  #
  # That split cannot survive the merge queue. The `ci` aggregate refuses a skipped
  # job on merge_group, so a pull_request-only lane here would fail every queue
  # entry and stop merging — the same trap `dco` sits in, and the same fix. It is
  # also the better answer on its own terms: a denied licence should be caught
  # BEFORE the merge, not by the artifact producer that runs after it. sbom.yml
  # still gates its own signing path, which is what that copy exists for.
  #
  # `make sbom` first because sbom-check reads the generated document — the gate
  # judges the resolved dependency graph, not the manifests.
  license-gate:
    name: license gate
    timeout-minutes: 30
    needs: [changes]
    if: >-
      needs.changes.outputs.deps == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # SBOM_VERSION is the release tag when HEAD sits exactly on one
          # (`git describe --tags --exact-match`), else the full revision —
          # resolving that needs the tags and history.
          fetch-depth: 0
      # syft and grant run through digest-pinned Docker images (see the Makefile),
      # so the runner needs only Docker — pre-installed on ubuntu-latest.
      - name: Generate the SBOMs
        run: make sbom
      - name: License gate
        run: make sbom-check

  # CI-based SonarCloud scan. Unlike Automatic Analysis, the scanner reads the
  # committed sonar-project.properties (exclusions + rule tuning + coverage
  # report paths), so that file is the single source of truth for analysis
  # scope — which is why we run the scan in CI rather than let the app analyze
  # blind. The scan step is guarded on the SONAR_TOKEN secret: with no token it
  # is a clean no-op (green). Once the secret is present (it is, added
  # 2026-07-06) the scan runs and posts the required "SonarCloud Code Analysis"
  # check. Disable Automatic Analysis in SonarCloud → project → Administration →
  # Analysis Method so the two do not compete (the CI scan is the source of
  # truth). This job is deliberately NOT gated by the `changes` path filter: the
  # "SonarCloud Code Analysis" context is a required check, so it must post on
  # every ready PR — a path-skipped job never reports and would block doc-only
  # PRs forever. It does NOT re-run the suites: it downloads the coverage
  # artifacts the integration fan-in (Go) and frontend (lcov) jobs already produced and
  # runs only the scanner, so there is no second Postgres/Redis/MinIO stack and
  # no duplicated test run.
  sonarcloud:
    name: sonarcloud (scan reads sonar-project.properties)
    timeout-minutes: 30
    # Runs LAST, after the jobs whose coverage it consumes. The condition admits
    # success OR skipped (not failure) for each, because the gates are
    # area-scoped: a frontend-only PR legitimately skips deterministic-gates +
    # integration (and a backend-only PR skips frontend) yet SonarCloud must
    # still post its required "SonarCloud Code Analysis" check. A skipped
    # upstream just means that area produced no coverage artifact — and on a
    # PR the scan proceeds without it, because new code there is the diff and
    # a diff that skipped an area has no lines in it for that area to cover.
    #
    # The last clause below — `event_name == 'pull_request' || integration
    # succeeded` — is what stops a partial run from publishing an analysis that
    # reads as a measurement. The scanner's Zero Coverage Sensor scores every
    # executable line it holds no report for as UNCOVERED, so a scan that ran
    # without the Go coverage producer publishes that code at 0% rather than
    # declining to answer. Measuring nothing is not a measurement of zero.
    #
    # On a pull request that cannot happen in a way that matters: new code is the
    # diff, and a diff that skipped an area has no lines in it for that area to
    # cover. Off a pull request it can, so `integration` — which alone stands for
    # the Go coverage, and which the backend classifier scope starts together with
    # every other backend producer — must genuinely have SUCCEEDED, not merely
    # not-failed.
    #
    # On merge_group the classifier is overridden and every producer runs, so the
    # clause is satisfied whenever the lane is green. It is kept rather than
    # simplified away because it is the thing that would catch a future event, or
    # a future skip, that reintroduces a partial scan.
    #
    # deterministic-gates is gated directly, not just transitively. Now that
    # integration runs in parallel with the build gate rather than behind it, a
    # failed build no longer skips integration — it can still go green on its
    # own. Requiring deterministic-gates.result to be success-or-skipped here is
    # therefore what keeps the scan from posting a green "SonarCloud Code
    # Analysis" check over a broken build (result == 'failure' fails this
    # condition, so the scan is skipped); the PR is already red, so nothing that
    # wasn't already blocked is blocked.
    # `ci` is in needs for the merge_group case ONLY, and it is not a cycle: the
    # aggregate deliberately omits sonarcloud from its own needs, so nothing waits
    # on this job to reach a verdict — the queue merges on `ci` alone and this scan
    # may finish after the merge.
    needs: [ci, deterministic-gates, integration, frontend, extension-reference]
    if: >-
      !cancelled()
      && (needs.deterministic-gates.result == 'success' || needs.deterministic-gates.result == 'skipped')
      && (needs.integration.result == 'success' || needs.integration.result == 'skipped')
      && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
      && (needs.extension-reference.result == 'success' || needs.extension-reference.result == 'skipped')
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event_name == 'pull_request' || needs.integration.result == 'success')
      && (github.event_name != 'merge_group' || needs.ci.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so SonarCloud can attribute blame / compute new code.
          fetch-depth: 0
      # Coverage the integration + frontend + extension-reference jobs already
      # produced. Each download is guarded on its producer having run (a
      # skipped area uploaded nothing); if-no-files-found tolerates the gap so
      # the scan still posts. The paths match sonar-project.properties
      # (backend/coverage.out, backend/coverage-extensions.out,
      # frontend/coverage/lcov.info).
      - name: Download Go coverage
        if: ${{ env.SONAR_TOKEN != '' && needs.integration.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-coverage
          path: backend
      - name: Download extension coverage
        if: ${{ env.SONAR_TOKEN != '' && needs.extension-reference.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-coverage-extensions
          path: backend
      - name: Download FE coverage
        if: ${{ env.SONAR_TOKEN != '' && needs.frontend.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fe-coverage
          path: frontend/coverage
      # A merge_group run publishes as `main`, and that is not a fiction: the
      # queue builds `main + the queued entries`, which is byte-for-byte the tree
      # main becomes when the batch merges. Measuring it here is the same
      # measurement the old push-to-main scan took, one step earlier.
      #
      # Without this override the scanner reads GITHUB_REF and files the analysis
      # under `gh-readonly-queue/main/pr-N-<sha>` — a branch that is deleted
      # minutes later. Nothing would ever update main again, and main's stored
      # analysis does not disappear when it stops being refreshed: it FREEZES. The
      # nightly `quality-gate` job in scheduled.yml reads `?branch=main` and would
      # keep reporting the last real verdict indefinitely, which is a green that
      # measures nothing — the exact failure this pipeline change exists to end.
      #
      # What makes it safe is the `needs.ci.result == 'success'` clause above, and
      # nothing weaker would: this job's other conditions cover only its COVERAGE
      # producers, so without that clause a merge_group build whose secret-scan,
      # license-gate, craft-residue or dco failed would still publish. That tree
      # does not merge — and it would have replaced the stored analysis every
      # scheduled check reads for main, describing a tree main never became.
      # Requiring the aggregate verdict is what makes "published as main" mean
      # "became main".
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: ${{ github.event_name == 'merge_group' && '-Dsonar.branch.name=main' || '' }}
      - name: No token yet — scan skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN not set; skipping CI scan (Automatic Analysis still active). Add the secret to activate."

  # The README quickstart, run literally: compose up → migrate → api →
  # seed-dev → verify-boot. This is what keeps the API-driven seed and
  # the boot proof honest — the integration job never boots the api or
  # runs the seed script, so those would rot invisibly without this job.
  live-boot:
    name: live-boot (compose + seed + verify)
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # Root, not frontend/: this branch moved the lockfile to a root pnpm
          # workspace so a unit's frontend/ can join it.
          cache-dependency-path: pnpm-lock.yaml
      # This lane compiles the composition generator and then `go run`s cmd/api.
      - name: Restore the Go build cache
        uses: ./.github/actions/go-build-cache
        with:
          flavor: plain
      - name: Boot the dev stack and migrate
        run: make db-up && make migrate
      # The deployment configuration (A107/ADR-0061): the api bootstraps the
      # demo organization itself at boot; the credentials match seed-dev.sh's
      # demo defaults (admin@demo.test / demo-password-123 — throwaway CI-only
      # values, same posture as the compose stack's dev DSNs).
      #
      # The password written here is the OPERATOR's, and a configured bootstrap
      # admits that account nowhere until it is replaced. `make seed-dev` below
      # performs that first-login replacement and lands on demo-password-123,
      # which is what verify-boot then signs in with — so this lane exercises
      # the real first-run sequence rather than routing around it.
      - name: Write the deployment configuration
        run: |
          printf '%s' "operator-supplied-first-password" > "$RUNNER_TEMP/admin-password"
          chmod 600 "$RUNNER_TEMP/admin-password"
          cat > "$RUNNER_TEMP/margince.yaml" <<EOF
          version: 1
          organization:
            name: Demo Workspace
            base_currency: EUR
            timezone: Europe/Berlin
          bootstrap_admin:
            email: admin@demo.test
            display_name: Demo Admin
            password_file: $RUNNER_TEMP/admin-password
          EOF
      - name: Start the api
        working-directory: backend
        env:
          MARGINCE_ENV: dev
        run: |
          # Composed boot (ADR-0069): a plain `go run` would resolve the
          # vanilla composition stub and this lane would never boot with
          # the enabled extensions (extensions/de ships by default). The
          # generator itself pins the ROOT workspace (the tool is its own
          # module — a stray GOWORK would break its resolution).
          GOWORK="$PWD/../go.work" go run ./tools/gen-composition
          GOWORK="$PWD/../build/composition/go.work" \
            go run ./cmd/api --dsn "postgres://margince_app:margince_app_dev@localhost:15432/margince" \
            --config "$RUNNER_TEMP/margince.yaml" \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "api never became ready" >&2
          cat "$RUNNER_TEMP/api.log" >&2
          exit 1
      - name: Seed the demo workspace
        run: make seed-dev
      - name: Verify boot
        run: make verify-boot
      - name: API log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  # The SPA lane. Its four jobs live in
  # .github/workflows/_lane-frontend.yml (fe-quality, fe-unit, fe-bundle and the
  # fan-in that carries their verdict).
  #
  # As with the integration lane, the conditional lives HERE and not inside the
  # lane, so a skip always means the caller skipped the lane.
  frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/_lane-frontend.yml

  # The UAT lane: the AC-<screen>-N screen-acceptance criteria as named
  # Playwright tests, plus the axe WCAG 2.2 AA gate, the 390px
  # no-horizontal-scroll sweep, and the PERF-1 record-open budget. The suite
  # mocks the API at the network edge (the coherent seed fixture), so it is
  # self-contained — no backend needed — and a UI regression that breaks a
  # named acceptance criterion fails the merge instead of shipping.
  uat:
    name: uat (AC screens + axe WCAG 2.2 AA + 390px, mocked)
    timeout-minutes: 20
    # Fail fast: the Playwright UAT lane only starts once the cheaper frontend
    # gate (biome + vitest + tsc + build) is green; both are frontend-gated, so
    # they skip together on non-frontend PRs.
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps and the Playwright Chromium browser
        working-directory: frontend
        # --ignore-scripts (githubactions:S6505): no lifecycle scripts run at
        # install; esbuild ships prebuilt platform binaries as optional deps.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Screen-acceptance UAT (build → preview → AC + axe)
        run: make frontend-e2e

  # ONE required context stands for the whole lane.
  #
  # Nine separately-required contexts were satisfiable by a run that did nothing:
  # GitHub reads a skipped required check as a passing one, and the classifier
  # skips whole jobs. This job is the only required context now, and
  # scripts/ci-verdict.sh is where "a skip is not a pass on the merge queue" is
  # written down and unit-tested (make test-ci-verdict).
  #
  # WHAT THE needs: LIST DELIBERATELY OMITS:
  #   changes                    — the classifier produces no verdict.
  #   fe-quality/-unit/-bundle   — absorbed by the `frontend` fan-in.
  #   integration-shards,
  #   integration-unit-coverage  — absorbed by the `integration` fan-in, which
  #                                already asserts on their results.
  #   sonarcloud                 — not a required check (merge speed during heavy
  #                                development). Listing it here would make it
  #                                blocking by the back door.
  #   vuln, live-boot, uat       — advisory today, and deliberately still
  #                                advisory here. See below.
  #
  # This list is EXACTLY the nine contexts the ruleset required before the
  # aggregate replaced them, and that equality is the point: this change moves
  # where the verdict is computed, not what the verdict covers. Adding a lane and
  # collapsing the contexts in one step would mean a red merge queue with two
  # candidate explanations, during the week we are establishing whether the queue
  # itself works.
  #
  # vuln, live-boot and uat are the tempting additions — they run on every
  # qualifying change and a red one does not stop a merge, which is not a state
  # worth keeping. The reason to wait is the batching: a flaky job under a merge
  # queue does not cost one re-run, it fails the whole group it was checked in and
  # every entry in that group is re-queued, and nothing has ever exercised these
  # three under a gate that blocks.
  # Promote them once the queue has a measured baseline, as their own change, so a
  # regression has one explanation.
  ci:
    name: ci
    timeout-minutes: 10
    # always(), so the verdict is reached when an upstream job fails rather than
    # being skipped along with it — a skipped aggregate is a green required check,
    # which is the whole failure mode this job exists to end.
    if: always()
    needs:
      - dco
      - deterministic-gates
      - craftsmanship
      - craft-residue
      - secret-scan
      - extension-reference
      - integration
      - frontend
      - license-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verdict
        env:
          CI_VERDICT_NEEDS: ${{ toJSON(needs) }}
          CI_VERDICT_EVENT: ${{ github.event_name }}
        run: ./scripts/ci-verdict.sh
