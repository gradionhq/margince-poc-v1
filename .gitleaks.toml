# Secret-scan policy for `make secret-scan` and CI's `secret-scan` job.
#
# This file is the whole policy. It is read by the same gitleaks invocation
# locally and in CI, so an exemption is argued for in the pull request that
# needs it — the previous scanner took its exclusions from a hosted dashboard
# instead, disagreed with the list committed here, and flagged fixtures this
# repo had already declared fake.
#
# An entry earns its place by naming why the match is not a credential. Prefer
# a scoped allowlist (a path AND a pattern) over a bare path exclusion: a whole
# file waved through stops being scanned for the real thing.
#
# A scoped exemption takes THREE elements, and dropping any ONE of them widens
# it to the whole file. Measured against the pinned scanner, by planting a token
# of the excused rule on a line the allowlist regex does not match:
#
#   targetRules       Without it the entry is GLOBAL: gitleaks skips the file
#                     before it reads a line, so `condition` never gets the
#                     chance to narrow anything and the exemption covers every
#                     rule (config.go: allowlists with targetRules are not added
#                     to the global list). Both scoped entries below were written
#                     this way first.
#   regexes           Without it the entry excuses the whole path for its rule —
#                     `paths` alone is a file exclusion wearing a rule's name.
#   condition = "AND" Without it the condition defaults to OR, and matching the
#                     PATH alone is then enough. Same result as no regexes at
#                     all, from an omission that looks like formatting.
#
# With all three, the file stays scanned — for the other rules AND for the
# excused rule on every line the regex does not name. That is the property
# scripts/test-secret-scan.sh holds: it derives its plants from the entries
# below, so every allowlist here owes one token of each rule it targets, in a
# file its own paths cover, and one of a rule it does not target. An allowlist
# nobody planted against is exactly the one that is over-broad.

[extend]
useDefault = true

# Tests and Storybook stories hold fabricated fixtures — stand-in passports and
# approval tokens, demo ids, and deliberately malformed URLs. The credentialed
# URLs in the websearch and person-discovery tests are the clearest case: they
# exist so the code under test can refuse them, so the literal HAS to look like
# a credential for the test to mean anything.
[[allowlists]]
description = "Fabricated fixtures in tests and Storybook stories"
paths = [
  '''_test\.go$''',
  '''\.test\.tsx?$''',
  '''\.stories\.tsx$''',
]

# The agent tool registry names the contract operations a tool composes —
# "getPerson/getOrganization/getDeal + listActivities". Slash-joined camelCase
# reads as high-entropy to the generic detector; it is an operation id, and the
# gen-agentpolicy drift gate would fail if it were anything else.
#
# Scoped to the module AND to the field declaration, not to the two filenames
# that happen to trip the detector today: six files in this package declare
# OpenAPIOp, and naming them individually would mean a new tool file, or one
# more operation in an existing list, failing the gate over a non-secret. The
# invariant is "an OpenAPIOp declaration in the agent registry is an operation
# id" — everything else in these files stays scanned.
[[allowlists]]
description = "OpenAPI operation ids in the agent tool registry"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''backend/internal/modules/agents/''']
regexes = ['''OpenAPIOp:\s''']

# The desktop build pins the source tarballs it downloads by SHA-256, and a
# checksum is 64 hex characters — indistinguishable from a token to an entropy
# detector, and the one thing in these scripts that must stay verbatim: it is
# what makes a tampered or truncated download fail the build instead of
# reaching a user's machine. The published upstream value is the opposite of a
# secret.
#
# Scoped to the assignment, not to the scripts: they also hold URLs and build
# flags, and a real credential pasted into one must still fail the gate.
#
# Both spellings, because the lane is two languages: bash writes
# PG_SHA256="..." and PowerShell $PG_SHA256 = '...'. Only the quote and the
# spacing vary, so the quote is matched as any single character rather than as
# a class naming both: a literal " on this line is refused by the shape gate in
# scripts/test-secret-scan.sh, and \x22 would read as RE2 intends but as three
# literal characters to the grep -E the same suite matches with. The suffix is
# what identifies the value either way.
[[allowlists]]
description = "Pinned upstream tarball checksums in the desktop build"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''desktop/build/''']
regexes = ['''_SHA256\s*=\s*.?[a-f0-9]{64}''']

# `linkedinStatus: LinkedinStatus` — a TypeScript prop and its type. The
# linkedin-client-id rule matches the type name, not a client id.
[[allowlists]]
description = "The LinkedinStatus type name in the connect scene"
targetRules = ["linkedin-client-id"]
condition = "AND"
paths = ['''frontend/src/screens/onboarding-conversation/connect-scene\.tsx$''']
regexes = ['''^LinkedinStatus$''']
