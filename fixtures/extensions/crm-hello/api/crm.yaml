#
# crm-hello's contract fragment. It declares hello_ping and NOTHING in Go
# declares a handler for it, which is the shape this fixture exists to
# exercise: a contract-only governed request. The verb appears in
# manifest.generated.json as a 🟡 request an operator must resolve, the merged
# contract publishes its route, and no tool is registered — so the composed
# surface serves nothing for it. crmhello.go therefore carries no Tools entry
# at all; an entry holding a nil Handle would say the same thing twice.
# The target path is written the way EVERY path in these contracts is written:
# relative to the document's own `servers` url, which already ends in /v1. Core
# writes /me and /auth/login; an extension writes /ext/<unit>/…. The server puts
# the base path back when it mounts the route (extension.Verb.ServedPath), so the
# served route is /v1/ext/crm-hello/… — spelling it here too would publish
# https://host/v1/v1/ext/… to every generated client, and the composer refuses it.
overlay: 1.0.0
info:
  title: crm-hello
  version: "0.1.0"
actions:
  - target: $.paths['/ext/crm-hello/ping']
    update:
      post:
        operationId: crmHelloPing
        summary: Acknowledge a ping.
        tags: [Extensions]
        x-mcp-tool:
          verb: hello_ping
          version: 1.0.0
          title: Hello ping
          # 🟡 on purpose: the walking skeleton must exercise the tier an
          # operator has to resolve, not only the one that resolves itself.
          tier: confirmation_required
          scope: read
          description: >-
            Acknowledge a ping and report nothing else. It exists to prove the
            extension declaration path end to end, so there is no workspace
            state it reads and none it changes, and nothing in its result to
            carry into a follow-up call.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        responses:
          '200':
            description: The acknowledgement.
            content:
              application/json:
                schema:
                  type: object
                  additionalProperties: false
                  required: [ok]
                  properties:
                    ok: { type: boolean }
          '401': { $ref: '#/components/responses/Unauthorized' }
          '403': { $ref: '#/components/responses/Forbidden' }
