# config/margince.example.yaml — the dev deployment configuration (A107/ADR-0061).
#
# `make dev` copies this to config/margince.yaml on first run and then LEAVES it
# — the same create-if-missing / leave-if-exists pattern as config/ai-routing.yaml
# — so your edits persist across `make dev-stop` / `make dev`. To reset, delete
# config/margince.yaml and re-run `make dev`.
#
# The api bootstraps the demo organization + admin from this file the first time
# it boots against an empty database; an existing installation just reads it.
version: 1

organization:
  name: Demo Workspace
  base_currency: EUR
  timezone: Europe/Berlin

bootstrap_admin:
  email: admin@demo.test
  display_name: Demo Admin
  # Read at boot (must be >=12 chars). `make dev` seeds the referenced file
  # (config/margince-admin-password) with the demo password on first run; the
  # path is relative to the repo root the api is launched from. These defaults
  # match scripts/seed-dev.sh — change both together if you change them.
  password_file: config/margince-admin-password

# Retention posture at first boot (optional). Consumed ONCE, when the api
# bootstraps the organization against an empty database — it is not re-read, and
# an admin can change the posture afterwards on the privacy settings screen.
#
#   standard    (or omitted) the shipped storage-limitation ladder runs: an
#               unconverted lead is anonymized after a year, a meeting transcript
#               and an AI payload are erased after a year, activities and lost
#               deals are archived. Art. 5(1)(e) compliant out of the box.
#   retain_only the SAME policy rows are planted, and nothing destructive ever
#               fires: no anonymize, no erase, however over-age a record becomes.
#               Archive still runs, because archiving retains. For an
#               installation under a contractual or statutory keep-everything
#               obligation — a seven-year engagement being the case that named it.
#
# Why declare it here rather than just toggling it in the UI: bootstrap plants the
# policy rows, and the nightly pass can fire before an admin first signs in. This
# closes that window. The rows stay visible under either posture, so an admin can
# always see what WOULD happen if the obligation lapsed.
# seeds:
#   retention:
#     default_policy: retain_only

# Entitlement (optional). The token is verified offline against the validation
# module bundled in the binary — no callout, so an air-gapped installation proves
# its entitlement like any other. A file reference, never an inline value: the
# token is a credential and this file is not.
#
# Omitted, the installation runs unlicensed, which is what every dev and CI
# process here does. Configured and REFUSED, the api and the worker both refuse
# to boot — a license that is present and unhonored is an operator mistake, not a
# downgrade to choose silently. MARGINCE_LICENSE overrides the file when set.
# license:
#   token_file: config/margince-license

# AI runtime posture (optional). Uncomment to turn on Layer-3 AI payload capture
# (ai_call_payload) — OFF by default because it stores special-category-adjacent
# content that then ages under the retention engine and the Art. 17 erasure
# cascade. Honored by both the api and worker roles (both take --config).
# ai:
#   capture_payloads: true

# Rates & costs "Refresh from sources" (worker role): an admin triggers an async
# refresh that stages confirm-first proposals into the approvals inbox; a human
# approves every change, nothing is auto-applied. Field reference:
# docs/reference/configuration.md#rates.
rates:
  # Base-relative FX JSON API ({base,rates}); defaults to api.frankfurter.dev.
  fx_source: https://api.frankfurter.dev/v1/latest
  # Currencies proposed to bootstrap an empty FX sheet; defaults to USD/GBP/CHF.
  fx_currencies: [USD, GBP, CHF]
  # provider -> pricing-page URL the model-cost refresh crawls + AI-extracts.
  # Name the provider exactly as ai-routing.yaml binds it; a provider with no
  # entry here is never refreshed, and its seeded rates go stale in silence.
  model_pricing:
    gemini: https://ai.google.dev/gemini-api/docs/pricing
    # anthropic: https://docs.anthropic.com/en/docs/about-claude/pricing
    # openai: https://platform.openai.com/docs/pricing
    # OpenRouter publishes prices as JSON rather than a page — per-token, so a
    # proposal is the catalog's number x 1e12 to reach micro-USD/MTok. Uncomment
    # alongside config/ai-routing.openrouter.example.yaml. The key is the generic
    # adapter's name: it refreshes whichever broker openai_compatible is bound to,
    # so change the URL if that is not OpenRouter.
    #
    # A JSON catalog is read one passage PER MODEL and narrowed to the models
    # ai-routing.yaml binds ON THIS PROVIDER — a broker lists hundreds, and
    # asking for all of them overruns the extraction's output ceiling. Two
    # consequences worth knowing: a model you do not bind is never repriced from
    # here (its seeded rate in ai.SeedModelRates stands), and if NONE of this
    # provider's bound ids appears in the catalog the refresh fails loudly rather
    # than reporting a successful no-op — that means an id here disagrees with
    # the vendor's own spelling. Debug it with `make ai-probe`
    # (docs/how-to/debug-an-ai-task.md).
    # openai_compatible: https://openrouter.ai/api/v1/models

# Remote MCP connector (Gate 1). On means /mcp and /oauth/* are served, so any
# human here can lend one of their passports to an outside client; it is on in
# this file so a local stack works unedited. The code default is off — delete
# this block and none of it exists. It needs --public-base-url (a bare origin),
# which cmd/api refuses to boot without; that refusal only catches an unset
# flag, and mail, reset links and the Gmail/Graph connectors need it too, so a
# deployment that already sets it serves the surface the moment it copies this.
mcp:
  connector_enabled: true

# The MCP App views (the ui:// documents a host renders beside a tool's answer)
# are static files the web tier serves, and the api reads them over HTTP:
# GET <origin>/mcp-apps/<view>.html, once at startup and periodically after.
# There is nothing to configure here — the origin is --mcp-apps-base-url /
# MARGINCE_MCP_APPS_BASE_URL, which DEFAULTS to --public-base-url, and the
# connector gate above already makes that a boot error to omit.
#
# Set it only when the api cannot reach the public origin: a container without
# ingress hairpin routing, external DNS or egress. The value has to be
# API-reachable, which is not the same as publicly reachable. A CDN origin works
# and is recommended — it trades the dependency on the web tier for a better
# one rather than removing it. The scheme must be https unless the host is a
# literal loopback or private address (or localhost): a cleartext hostname like
# http://web.internal is a boot error, not a silent one. See
# docs/reference/configuration.md.

# Ordered company-context rollout (OPS-CFG-10). The default is onboarding;
# moving backward disables reads/injection/surfaces but never deletes confirmed
# company data. Stages include the prior stage: off < read < tasks < onboarding.
company_context:
  rollout: onboarding
