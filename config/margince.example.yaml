# config/margince.example.yaml — the dev deployment configuration (A107/ADR-0061).
#
# `make dev` copies this to config/margince.yaml on first run and then LEAVES it
# — the same create-if-missing / leave-if-exists pattern as config/ai-routing.yaml
# — so your edits persist across `make dev-stop` / `make dev`. To reset, delete
# config/margince.yaml and re-run `make dev`.
#
# The api bootstraps the demo organization + admin from this file the first time
# it boots against an empty database; an existing installation just reads it.
version: 1

organization:
  name: Demo Workspace
  base_currency: EUR
  timezone: Europe/Berlin

bootstrap_admin:
  email: admin@demo.test
  display_name: Demo Admin
  # Read at boot (must be >=12 chars). `make dev` seeds the referenced file
  # (config/margince-admin-password) with the demo password on first run; the
  # path is relative to the repo root the api is launched from. These defaults
  # match scripts/seed-dev.sh — change both together if you change them.
  password_file: config/margince-admin-password

# Authentication methods (optional; email+password is on by default).
#
# Federated sign-in is OpenID Connect, not bare OAuth, and it NEVER creates an
# account: the verified Google address must match a local user, and from the
# first match on that human is identified by the provider's stable subject. Turn
# it on only once the Google Cloud OAuth client exists, because the login screen
# renders exactly the methods that work — and register this exact redirect URI
# there (dev, where Vite serves the app on :8080 and proxies /v1):
#
#   http://localhost:8080/v1/auth/oidc/google/callback
#
# The api also needs --public-base-url (http://localhost:8080 in dev): the
# redirect target is derived from it, never from a request Host.
# auth:
#   oidc:
#     enabled: true
#     issuer: https://accounts.google.com
#     client_id: xxxxxxxx.apps.googleusercontent.com
#     # Mode 0600, gitignored, never inline (OPS-CFG-3).
#     client_secret_file: config/margince-google-client-secret
#     # Optional. With one domain the provider's account chooser is narrowed to
#     # it; enforcement uses Google's own verified `hd` claim, not the address.
#     allowed_domains: [gradion.com]
#   # Turning password login off is refused unless oidc.enabled is true.
#   password:
#     enabled: true

# AI runtime posture (optional). Uncomment to turn on Layer-3 AI payload capture
# (ai_call_payload) — OFF by default because it stores special-category-adjacent
# content that then ages under the retention engine and the Art. 17 erasure
# cascade. Honored by both the api and worker roles (both take --config).
# ai:
#   capture_payloads: true

# Rates & costs "Refresh from sources" (worker role): an admin triggers an async
# refresh that stages confirm-first proposals into the approvals inbox; a human
# approves every change, nothing is auto-applied. Field reference:
# docs/reference/configuration.md#rates.
rates:
  # Base-relative FX JSON API ({base,rates}); defaults to api.frankfurter.dev.
  fx_source: https://api.frankfurter.dev/v1/latest
  # Currencies proposed to bootstrap an empty FX sheet; defaults to USD/GBP/CHF.
  fx_currencies: [USD, GBP, CHF]
  # provider -> pricing-page URL the model-cost refresh crawls + AI-extracts.
  # Name the provider exactly as ai-routing.yaml binds it; a provider with no
  # entry here is never refreshed, and its seeded rates go stale in silence.
  model_pricing:
    gemini: https://ai.google.dev/gemini-api/docs/pricing
    # anthropic: https://docs.anthropic.com/en/docs/about-claude/pricing
    # openai: https://platform.openai.com/docs/pricing
    # OpenRouter publishes prices as JSON rather than a page — per-token, so a
    # proposal is the catalog's number x 1e12 to reach micro-USD/MTok. Uncomment
    # alongside config/ai-routing.openrouter.example.yaml. The key is the generic
    # adapter's name: it refreshes whichever broker openai_compatible is bound to,
    # so change the URL if that is not OpenRouter.
    # openai_compatible: https://openrouter.ai/api/v1/models

# Remote MCP connector (Gate 1). On means /mcp and /oauth/* are served, so any
# human here can lend one of their passports to an outside client; it is on in
# this file so a local stack works unedited. The code default is off — delete
# this block and none of it exists. It needs --public-base-url (a bare origin),
# which cmd/api refuses to boot without; that refusal only catches an unset
# flag, and mail, reset links and the Gmail/Graph connectors need it too, so a
# deployment that already sets it serves the surface the moment it copies this.
mcp:
  connector_enabled: true

# Ordered company-context rollout (OPS-CFG-10). The default is onboarding;
# moving backward disables reads/injection/surfaces but never deletes confirmed
# company data. Stages include the prior stage: off < read < tasks < onboarding.
company_context:
  rollout: onboarding
