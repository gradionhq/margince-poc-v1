format: table # Output format: "table" or "json" (default: "table")
quiet: false # Suppress all non-essential output (default: false)
verbose: false # Enable verbose output (default: false)

# Allowed licenses. Baseline set: MIT, Apache-2.0, BSD-2-Clause,
# BSD-3-Clause, ISC, 0BSD, Zlib, BSL-1.0, CC0-1.0. Extended to cover the
# permissive / weak-copyleft licenses of dependencies actually present in the
# tree (MIT-0, BlueOak-1.0.0, MPL-2.0, PostgreSQL) plus CC-BY-4.0 / Python-2.0 /
# Unlicense (maintainer decision). BUSL-1.1 is Margince's own source license.
#
# PostgreSQL is the license of github.com/jackc/pgerrcode, which the pgx family
# brings in and #654 first surfaced here. It is OSI-approved and permissive —
# the same "do what you like, keep the notice, no warranty" shape as BSD-2-Clause
# and ISC above, which is why it belongs in this list rather than in
# ignore-packages: this dependency IS linked into the shipped product, and the
# ignore list is for things that only ever run in CI.
allow:
  - Apache-2.0
  - MIT
  - MIT-0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - Zlib
  - BSL-1.0
  - BlueOak-1.0.0
  - MPL-2.0
  - PostgreSQL
  - CC0-1.0
  - CC-BY-4.0
  - Python-2.0
  - Unlicense
  - BUSL-1.1

# First-party components carry no third-party license to gate. The scan now
# covers the whole committed tree (see .syft.yaml), so CI Actions reach grant as
# packages; `make sbom-supplement` fills in their real (permissive) licenses,
# except SonarSource's scanner action, which is LGPL-3.0-only. That action runs
# only in CI — it is never linked into or shipped with the product, so its
# copyleft never reaches Margince's BUSL-1.1 source — so it is ignored here rather
# than admitted to `allow`, which stays the set of licenses accepted into the
# shipped product. Every other package must still resolve to a known, allowed
# license.
ignore-packages:
  - github.com/gradionhq/margince/* # our own Go modules
  - example.margince.dev/* # committed extension stubs (ADR-0069), first-party
  - SonarSource/sonarqube-scan-action # LGPL-3.0-only CI scanner action, runs in CI only, never shipped

require-license: true # When true, deny packages with no detected licenses
require-known-license: true
disable-file-search: false # Disable filesystem license file search
summary: true
