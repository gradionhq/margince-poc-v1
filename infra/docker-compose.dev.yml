# The dev/test infrastructure stack. `make db-up` brings it up (and applies
# scripts/db-init.sql on top for the non-owner app role); `make clean` tears
# it down including data. Ports and credentials are a contract shared with
# the backend Makefile's MARGINCE_TEST_* defaults, scripts/dev.sh, and CI's
# service containers — change them everywhere or nowhere.
#
# Every host port here MUST stay below 32768. That is the floor of Linux's
# default ephemeral range (32768–60999, `sysctl net.ipv4.ip_local_port_range`),
# which the kernel draws from for the SOURCE port of any outbound connection.
# A port in that range is not ours to bind: any unrelated process on the host —
# a docker pull, `go mod download`, the CI runner's own agent — can transiently
# hold it as a client port, and compose then dies with
# `failed to bind host port for 0.0.0.0:<port>: address already in use`.
# It is a race, so it presents as a flake that names whichever step happened to
# call `make db-up`. The numbers below keep the "port with a prefix digit" shape
# of the originals (55432/56379/59000/59001) while putting the class of failure
# out of reach; do not renumber back upward. `make check-host-ports` enforces
# the floor, because the constraint is invisible in the number itself.
#
# The second constraint the floor does not cover: scripts/dev.sh gives each
# `make dev DEV_SLUG=<slug>` stack a hash-derived port, `8080 + (hash % 1000)`
# for the app and `18080 + …` for the api — so 8080–9079 and 18080–19079 are
# BOTH spoken for, by one slug out of a thousand rather than reliably. That is
# why MinIO is 29000/29001 and not the 19000/19001 the prefix pattern would
# suggest: 19000 is inside the api's span, and the collision would surface only
# for whichever engineer's slug happened to hash to 920.
#
# Images are digest-pinned to the multi-arch INDEX digest (works on both
# arm64 dev machines and amd64 CI — CI's integration lane runs this same
# compose file via `make db-up`, so these are the only pins). Bump tag and
# digest together. The check-image-pins gate fails a floating tag here.
#
# The project name is repo-specific: a generic name (margince-dev) collides
# with stale volumes from the frozen poc-era stack on machines that ran it,
# and Postgres skips initdb on a non-empty volume — the owner role would
# silently never be created.
name: margince-poc-v1

services:
  postgres:
    # pgvector ships inside the Postgres image: the search module's hybrid
    # retrieval needs the extension available at migrate time.
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    # max_locks_per_transaction sizes the CLUSTER-WIDE lock table, not a
    # per-transaction budget: the instance gets
    # max_locks_per_transaction × (max_connections + max_prepared_transactions)
    # heavyweight lock slots, shared by every backend, fixed at startup. A
    # transaction that cannot get a slot does not queue — it fails outright with
    # `out of shared memory (SQLSTATE 53200)`.
    #
    # The integration lane's demand is not incidental, it is the lane's shape.
    # scripts/test-integration-parallel.sh runs INTEGRATION_JOBS packages at
    # once (16 in CI), each against its own clone of THIS instance, and each
    # resets between tests by emptying every table in public + ext inside ONE
    # transaction — deliberately one, so a reset is atomic (see
    # backend/internal/platform/testdb/reset.go). A lock is taken per RELATION,
    # every table AND every index, so a ~620-table schema costs well over a
    # thousand, and an atomic whole-schema reset cannot cost less. Against the
    # stock default's 64 × 100 = 6,400 slots the lane is simply over budget, and
    # the shortfall is what made three unrelated suites fail on 53200 in one CI
    # shard.
    #
    # 512 × 100 = 51,200 slots, so schema growth and a higher INTEGRATION_JOBS do
    # not immediately re-cross it. Slots are a few hundred bytes each: this costs
    # single-digit megabytes of shared memory reserved at boot.
    #
    # This is headroom, NOT the fix. The fix is that no single transaction holds
    # the whole schema: EnsureSchema's `DROP SCHEMA public CASCADE` was one
    # 4,999-lock statement — 78% of the stock instance in one go, so two callers
    # could never coexist — and reset.go now takes it apart into bounded steps.
    # Raise this ceiling to paper over a new whole-schema transaction and the
    # next twenty tables will re-cross it.
    # max_connections is the SAME lane and the same shape of demand, and until
    # #1109 it was the one number here nobody had ever set: the stock 100.
    #
    # The demand is a product, exactly as the lock demand above is, and
    # scripts/lib-testdb.sh is where its terms are declared — this number is
    # their sum, not a round figure chosen to be comfortable:
    #
    #   INTEGRATION_JOBS                   16   (.github/workflows/ci.yml)
    #   x LANE_CONNS_PER_PACKAGE           24   two pools at LANE_POOL_MAX_CONNS=8,
    #                                           plus 8 for what the pin does not
    #                                           reach — see the term's own note
    #   + one admin connection per slot     1   CREATE/DROP DATABASE at a handover
    #   ------------------------------------
    #     16 x (24 + 1)                  = 400
    #   + LANE_FIXED_CONNS                  8   template migrate 2, superuser
    #                                           reserve 3, an operator's psql 3
    #   ------------------------------------
    #                                    = 408
    #
    # Measured, so the terms are not guesses: at INTEGRATION_JOBS=16 the whole
    # cluster peaks at 86 backends and one package at 16, sampled every 100ms
    # from OUTSIDE the lane's transactions — a sample taken inside one is frozen
    # for that transaction's lifetime and under-reports. The gap between 85 and
    # 408 is the point: the ceiling is what has to fit, because whether a run
    # stays near its average is decided by how the bursts overlap, which is the
    # entire content of #1109.
    #
    # TestTheLaneFitsInsideTheClusterItRunsAgainst (backend/laneconnbudget_test.go)
    # reads INTEGRATION_JOBS from the workflow and this number from this file, and
    # asks the lane script's own declare_lane_budget for the sum rather than
    # re-implementing it. It fails `make check` when the two stop fitting. Raising INTEGRATION_JOBS without raising this is
    # therefore a red gate rather than a lane that fails somewhere else.
    #
    # Capacity is only half of it. The per-package ceiling is PINNED as well:
    # the lane exports MARGINCE_TEST_POOL_MAX_CONNS and testdb applies it when it
    # builds a pool, so the demand is a known number rather than whatever
    # database.NewPool falls back to. It travels as an environment variable and
    # NOT in the clone DSNs, because cmd/migrate and every bare pgx connection a
    # fixture opens parse those same DSNs with pgx.ParseConfig, which forwards an
    # unknown pool_* key to the server as a startup parameter and fails the
    # connection. Capacity alone would leave the two numbers free to drift apart.
    #
    # ⚠ This raises the LOCK budget too, because the product above is
    # max_locks_per_transaction x (max_connections + max_prepared_transactions):
    # 512 x 408 = 208,896 slots. Checked rather than assumed, because a change
    # that fixes connects and reintroduces SQLSTATE 53200 has moved the failure
    # rather than fixed it: the server reports shared_memory_size = 230MB at 408
    # and 204MB at 280, so each 128 connections costs ~26MB of shared memory
    # taken at boot. It is
    # also the direction that HELPS: a whole-schema reset needs more lock slots,
    # not fewer. Lower max_connections and that product falls with it, and the
    # 53200 the comment above is about comes back.
    command:
      - postgres
      - -c
      - max_locks_per_transaction=512
      - -c
      - max_connections=408
    environment:
      POSTGRES_USER: margince_owner
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: margince
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Probe over TCP, never the unix socket: on first boot the entrypoint's
      # temporary bootstrap server (initdb + init scripts) serves ONLY the
      # socket, so a socket probe reports ready inside the window where that
      # server is torn down before the real one starts — and a psql that
      # trusts compose's Healthy lands on a missing socket. The TCP listener
      # exists only on the final server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U margince_owner -d margince"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
    # 64 logical dbs, not the default 16. The integration lane gives each package
    # its own db so two packages can never share one — several of them FLUSHDB
    # between tests, which makes a shared db a silent corruption rather than a
    # slowdown. The lane has more packages than 16 and keeps growing; keep this
    # in step with REDIS_DBS in scripts/test-integration-parallel.sh, which
    # refuses to run rather than wrap the mapping.
    command: ["redis-server", "--databases", "64"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  # MinIO backs the blobstore seam (attachment/transcript object bytes).
  # Host ports 29000 (S3 API) / 29001 (console)
  # are part of the MARGINCE_TEST_BLOBSTORE_* contract shared with the backend
  # Makefile and CI — change them everywhere or nowhere. No compose healthcheck:
  # the minio image ships no curl, and platform/blobstore's New tolerates a
  # not-yet-ready backend with a bounded connect retry and creates the bucket,
  # so readiness is the store's job, not compose's.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # :9001 is the CONTAINER-side port, which is what --console-address sets —
    # the host number lives in `ports:` below and nowhere else. This read
    # ":59001" until 2026-08-11, matching the host side of the old mapping, so
    # the console listened on a container port nothing forwarded to and
    # localhost:59001 was refused for as long as the console has existed. The S3
    # API was unaffected (it defaults to :9000), which is why the lane never
    # noticed.
    command: server /data --console-address ":9001"
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - minio-data:/data

volumes:
  pgdata: {}
  minio-data: {}
