#
# notes's scheduled job, declared in the contract the core job kinds live in
# (jobs.yaml). gen-composition merges it into build/composition/api/jobs.yaml
# and reads the pair back out of the MERGED document, so what the worker
# registers and what this file says cannot disagree.
#
# TWO kinds, not one. gen-jobs forbids a cadence on a workspace-role kind — a
# kind that both ticks and carries a tenant has no honest answer for whose data
# the tick touched — so a scheduled extension job is a cadenced DISPATCHER that
# enumerates the live fleet and a workspace CHILD that does one tenant's work.
# The child's kind is the dispatcher's plus _ws, and the composer derives the
# edge rather than letting this file spell it twice.
#
# queue: default, because `queues` is NOT a container a fragment may extend. A
# River queue is a bound on the installation's worker pool shared with core
# work, so an extension job rides a pool the installation already declared
# rather than allocating one from a directory.
overlay: 1.0.0
info:
  title: notes
  version: "1.0.0"
actions:
  - target: $.kinds['ext_notes_heartbeat']
    update:
      job: heartbeat
      role: dispatcher
      queue: default
      # Short enough that a human watching the screen sees a tick without
      # waiting, long enough that a dev install's log is not mostly heartbeats.
      cadence: 60s
      timeout: 30s
      # 🟢 write: the tick writes one row into the unit's own table. It cannot
      # be confirm-first (a job has no caller to confirm it) and it cannot be
      # outbound (autonomous outbound authority on a clock) — the job seam
      # refuses both outright.
      tier: auto_execute
      scope: write

  - target: $.kinds['ext_notes_heartbeat_ws']
    update:
      job: heartbeat
      role: workspace
      queue: default
      timeout: 30s
      # Small on purpose, like every other fan-out child's: the real retry
      # cadence is the dispatcher's next tick, a minute away.
      max_attempts: 3
      # No tier and no scope, and their absence is the rule rather than an
      # omission: the pair resolves as ONE governed job, so its governance is
      # declared once, on the dispatcher above. A copy here would be a line
      # the composer discards — and the composer now refuses it instead.
