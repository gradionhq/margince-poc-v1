#
# zalo-personal's scheduled capture, declared in the contract the core job kinds
# live in. gen-composition merges it into build/composition/api/jobs.yaml and
# reads the pair back out of the MERGED document, so what the worker registers
# and what this file says cannot disagree.
#
# TWO kinds, not one: a cadenced DISPATCHER that enumerates the live fleet and a
# workspace CHILD that takes one tenant's turn. A kind that both ticks and
# carries a tenant has no honest answer for whose data the tick touched, so the
# generator forbids it.
#
# WHAT THIS TICK IS ALLOWED TO READ is not decided here. It reads one member's
# messages only where that member has connected their own account AND chosen
# which conversations to allow; a member who has not chosen is not enumerated at
# all and no socket of theirs is opened. The cadence below governs how often that
# happens, never whether it may.
overlay: 1.0.0
info:
  title: zalo-personal
  version: "1.0.0"
actions:
  - target: $.kinds['ext_zalo_personal_poll_inbox']
    update:
      job: poll_inbox
      role: dispatcher
      queue: default
      # Five minutes, and this number is a PLACEHOLDER WITH A REASON rather than
      # a considered setting. What has to settle it is the measurement DESIGN
      # §9.1 blocks on: how deep Zalo's own undelivered queue goes and how long
      # it holds a message. Until that is measured, the member-visible backfill
      # after any gap is bounded by a depth nobody has observed — the one probe
      # run saw a single message held for about an hour against a claimed three
      # days — so a tighter cadence would be buying freshness against an unknown
      # and a looser one would be risking loss against the same unknown. Five
      # minutes is the interval at which a rep experiences a chat message
      # reaching the timeline as "it is just there" while spending the fewest
      # sockets on a protocol with no acknowledgement.
      #
      # Polling harder does not merely cost requests here: with no ack
      # identified, every tick re-reads the member's whole undelivered backlog.
      cadence: 300s
      # Wide enough for a fleet of one workspace's members, each of which resumes
      # a session, drains a socket until it goes quiet, and ingests what it
      # found. The PER-MEMBER budget in poll.go is a sub-budget of this, which is
      # what keeps one stalled session from spending the whole tick.
      timeout: 300s
      # 🟢 write: the tick writes this unit's own connection rows and hands
      # records to core capture through the governed ingress port — which runs on
      # the connected member's live authority, not on the job's. It cannot be
      # confirm-first (a job has no caller to confirm it) and it cannot be
      # outbound (autonomous outbound authority on a clock), and the job seam
      # refuses both outright.
      tier: auto_execute
      scope: write

  - target: $.kinds['ext_zalo_personal_poll_inbox_ws']
    update:
      job: poll_inbox
      role: worker
      queue: default
      timeout: 300s
      # Small on purpose, like every other fan-out child's: the real retry
      # cadence is the dispatcher's next tick, five minutes away, and a turn that
      # failed because a member's session is dead gains nothing from three fast
      # retries — that one is fixed by a human with a phone.
      max_attempts: 3
      # No tier and no scope: the pair resolves as ONE governed job, so its
      # governance is declared once, on the dispatcher above.
