#
# zalo-personal's scheduled capture, declared in the contract the core job kinds
# live in. gen-composition merges it into build/composition/api/jobs.yaml and
# reads the pair back out of the MERGED document, so what the worker registers
# and what this file says cannot disagree.
#
# TWO kinds, not one: a cadenced DISPATCHER that enumerates the live fleet and a
# workspace CHILD that takes one tenant's turn. A kind that both ticks and
# carries a tenant has no honest answer for whose data the tick touched, so the
# generator forbids it.
#
# WHAT THIS TICK IS ALLOWED TO READ is not decided here. It reads one member's
# messages only where that member has connected their own account AND chosen
# which conversations to allow; a member who has not chosen is not enumerated at
# all and no socket of theirs is opened. The cadence below governs how often that
# happens, never whether it may.
overlay: 1.0.0
info:
  title: zalo-personal
  version: "1.0.0"
actions:
  - target: $.kinds['ext_zalo_personal_poll_inbox']
    update:
      job: poll_inbox
      role: dispatcher
      queue: default
      # ONE MINUTE, AND THIS IS NOT THE COST CONTROL. It used to be five minutes,
      # because this number and a member's own polling interval were treated as one
      # setting — and they are not the same size at all:
      #
      #   * A DISPATCHER RUN with nobody due is ONE indexed query against
      #     ext_zalo_personal_connection (plus one indexed DELETE that ages out send
      #     markers). No credential is unsealed, no socket is opened, no roster is
      #     read. It is effectively free, and running it every minute costs nothing
      #     anybody can measure.
      #   * A MEMBER'S DRAIN is a login call plus a TLS and a WebSocket handshake, per
      #     member, paid whether or not anything arrived. THAT is the expensive thing,
      #     and `poll_after` on each connection row is what controls it — the backoff
      #     ladder in cadence.go, untouched by this number.
      #
      # So this cadence decides only HOW SOON a member who has just become due is
      # actually reached; it does not decide how often anybody is handshaked. A member
      # inside their backoff is not returned by the fleet read at all, so a run that
      # finds nobody costs the one query above.
      #
      # WHY IT MATTERS THAT IT STAYS SMALL, which is the part somebody will otherwise
      # "optimise" away: at five minutes a rep who connects, chooses a mode and saves
      # waited up to five minutes to see anything happen — and the save clears the
      # backoff precisely so they would not. Observed in live testing: the tick ran at
      # 19:36, found nothing, backed the member off, and the next run arrived four
      # seconds before they were due and skipped them. From the outside that is
      # indistinguishable from a broken feature, and it is a rep's first impression of
      # this connector.
      #
      # RAISING THIS SAVES NOTHING AND COSTS THAT. Handshake volume is bounded by
      # poll_after in every case; the only thing a longer cadence buys is a slower
      # first impression. If provider load ever needs cutting, the lever is
      # maxPollBackoff, not this.
      cadence: 60s
      # Wide enough for a fleet of one workspace's members, each of which resumes
      # a session, drains a socket until it goes quiet, and ingests what it
      # found. The PER-MEMBER budget in poll.go is a sub-budget of this, which is
      # what keeps one stalled session from spending the whole tick.
      timeout: 300s
      # 🟢 write: the tick writes this unit's own connection rows and hands
      # records to core capture through the governed ingress port — which runs on
      # the connected member's live authority, not on the job's. It cannot be
      # confirm-first (a job has no caller to confirm it) and it cannot be
      # outbound (autonomous outbound authority on a clock), and the job seam
      # refuses both outright.
      tier: auto_execute
      scope: write

  - target: $.kinds['ext_zalo_personal_poll_inbox_ws']
    update:
      job: poll_inbox
      role: worker
      queue: default
      timeout: 300s
      # Small on purpose, like every other fan-out child's: the real retry
      # cadence is the dispatcher's next tick, five minutes away, and a turn that
      # failed because a member's session is dead gains nothing from three fast
      # retries — that one is fixed by a human with a phone.
      max_attempts: 3
      # No tier and no scope: the pair resolves as ONE governed job, so its
      # governance is declared once, on the dispatcher above.
