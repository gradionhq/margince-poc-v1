#
# zalo-oa's contract fragment. The FILENAME names the core contract it extends
# (crm.yaml); gen-composition merges it into build/composition/api/crm.yaml, and
# that merged file is what the operator manifest, the client types, the mounted
# routes and the docs read. So this document — not the Go — is where every
# operation's risk tier, Passport scope, RBAC object, prose and I/O schemas are
# declared.
#
# THREE OPERATIONS: connect, status, disconnect.
#
# CONNECTING TAKES A TOKEN PAIR rather than conducting a browser flow. Zalo has no
# client-credentials grant for an Official Account — an OA admin must open a
# permission URL and click *Cho phép*, and what returns is a single-use code that
# dies in ten minutes. That trip mints the FIRST pair and nothing else, so it is
# run once with a tool, by a human, outside the product; from then on the pair
# renews itself unattended. The cost, stated rather than discovered: onboarding is
# not self-serve.
#
# NONE OF THEM TAKES A USER ID, and that absence is load-bearing. Whoever connects
# the account becomes its `authorized_by`: their sealed credential is what the
# poll spends, and their LIVE authority is what every captured message is landed
# on. An operation that let one person deposit a credential in a colleague's name
# would forge, through this unit's own front door, the consent the ingress port
# checks.
#
# One RBAC object, ext_zalo_oa_connection, held by no seeded role: connecting an
# Official Account reaches every conversation that account has, so granting it is
# a decision an operator makes rather than one an install makes for them.
overlay: 1.0.0
info:
  title: zalo-oa
  version: "1.0.0"
actions:
  - target: $.paths['/ext/zalo-oa/connect']
    update:
      # PUT, because an installation has ONE Official Account: connecting a second
      # time replaces the first rather than adding to it. A POST would publish
      # "create another one" for an operation that cannot.
      put:
        operationId: zaloOaConnect
        summary: Connect this installation's Zalo Official Account.
        tags: [Extensions]
        x-rbac-object: ext_zalo_oa_connection
        x-rbac-action: update
        x-mcp-tool:
          verb: zalo_oa_connect
          version: 1.0.0
          title: Connect a Zalo Official Account
          # 🟢 write: it seals credentials the caller already holds in the unit's
          # own namespace and writes the unit's own row. It does spend the
          # supplied refresh token once, at the provider — which renews this
          # installation's own credential and reaches no third party.
          #
          # A CREDENTIAL DEPOSIT THAT REPOINTS A WHOLE INSTALLATION'S CHANNEL
          # IDENTITY is the archetype of a confirm-first act, and it is not one
          # here for a reason that is a property of this tier rather than a
          # judgement about the operation: a served extension tool may not
          # declare TierConfirmationRequired at all — this surface cannot stage
          # an approval, so the boot refuses it. What stands in its place is that
          # ext_zalo_oa_connection is held by NO seeded role, so an agent reaches
          # this only on the live authority of a human an operator granted it to,
          # and the sibling unit's connect carries the same tier.
          tier: auto_execute
          scope: write
          description: >-
            Connect a Zalo Official Account, using the App ID and App Secret from
            developers.zalo.me and a token pair from running the Zalo
            authorization once. Before anything is stored the account is checked
            for the paid package this connector needs, by asking the API rather
            than by reading the package name — a free-tier account is refused with
            what it would cost to upgrade, and an account whose app has simply not
            enabled the right permission group is told that instead, because that
            costs nothing. The supplied refresh token is then spent immediately,
            once, which proves it works and replaces it with a pair only this
            installation holds; a Zalo refresh token can be used only once, so a
            pair anything else is still using will not connect. Whoever calls this
            becomes the connection's administrator, and an installation has one
            Official Account, so connecting replaces whatever was connected
            before.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [app_id, app_secret, access_token, refresh_token]
                # No user member, deliberately. See the header.
                properties:
                  app_id:
                    type: string
                    minLength: 1
                    maxLength: 128
                    description: >-
                      The App ID of the Zalo application the grant was made
                      through, from developers.zalo.me. It is not a credential and
                      is stored in the clear so a screen can show which app is in
                      use.
                  app_secret:
                    type: string
                    minLength: 1
                    maxLength: 512
                    description: >-
                      That application's App Secret. Every renewal spends it. It is
                      sealed by the installation's custodian and is never returned.
                  access_token:
                    type: string
                    minLength: 1
                    maxLength: 2048
                    description: >-
                      The access token from the authorization. It is spent once
                      here, to check the account's package, and then replaced by
                      the renewal below — so a token near the end of its
                      twenty-five hours still connects.
                  refresh_token:
                    type: string
                    minLength: 1
                    maxLength: 2048
                    description: >-
                      The refresh token from the authorization. It is SINGLE-USE
                      and is spent immediately: what is stored is the pair that
                      replaces it, so nothing outside this installation is left
                      holding a live credential. A token already spent — by the
                      tool that produced it, or by a previous connect — is refused
                      here rather than twenty-five hours later.
        responses:
          '200':
            description: The connected account.
            content:
              application/json:
                schema:
                  type: object
                  additionalProperties: false
                  required: [id, oa_id, app_id, authorized_by, status, high_water_mark, version,
                    poll_request_budget]
                  description: >-
                    This installation's Zalo connection. It carries no token — the
                    credentials are sealed in the unit's secret namespace and no
                    operation returns them.
                  properties:
                    id: { type: string, format: uuid }
                    oa_id:
                      type: string
                      description: >-
                        Zalo's own id for the connected Official Account, and the namespace
                        every person binding and every captured message key is prefixed
                        with. It is taken from what the credential answers for, never from
                        a request.
                    app_id: { type: string }
                    authorized_by:
                      type: string
                      format: uuid
                      description: >-
                        The administrator who connected the account: whose sealed
                        credential the poll spends, and whose live authority every captured
                        message is landed on.
                    status:
                      type: string
                      enum: [connected, reauth_required, tier_lapsed]
                      description: >-
                        `connected` is working. `reauth_required` means the credential can
                        no longer be renewed and an administrator must connect a fresh
                        token pair. `tier_lapsed` means the credential is fine and the
                        Official Account's package is not.
                    account_label:
                      type: string
                      description: What Zalo says this Official Account is called.
                    package_name:
                      type: string
                      description: >-
                        The Official Account's package, as Zalo names it — shown as
                        evidence and compared against nothing.
                    package_valid_through:
                      type: string
                      description: When that package expires, as Zalo reports it.
                    access_token_expires_at:
                      type: string
                      format: date-time
                      description: When the sealed access token stops being accepted.
                    refresh_claimed_at:
                      type: string
                      format: date-time
                      description: Set while a renewal is in flight.
                    high_water_mark:
                      type: integer
                      format: int64
                      description: >-
                        The newest message this connection has decided about, as a
                        millisecond timestamp.
                    backfill_before:
                      type: integer
                      format: int64
                      description: >-
                        Where a poll that ran out of page budget stopped. Zero means there
                        is no gap.
                    pending_high_water_mark:
                      type: integer
                      format: int64
                      description: >-
                        The newest message decided about above an unread region.
                    backfill_offset:
                      type: integer
                      description: Where in the provider's global walk the unread region began.
                    last_polled_at: { type: string, format: date-time }
                    last_error_class:
                      type: string
                      description: >-
                        What went wrong on the last poll, in this unit's own vocabulary.
                        Zalo's own message is deliberately not carried.
                    version: { type: integer }
                    poll_request_budget:
                      type: integer
                      minimum: 2
                      maximum: 200
                      description: >-
                        How many provider requests one scheduled poll may spend, including the
                        call that re-reads the account. It is a property of the ACCOUNT rather
                        than of the build: an installation with four conversations and one with
                        four hundred need different ceilings. Zalo publishes no per-account rate
                        limit in any response header, so the ceiling can only be chosen, never
                        discovered.
          '401': { $ref: '#/components/responses/Unauthorized' }
          '403': { $ref: '#/components/responses/Forbidden' }
          # The tier gate's refusals arrive here: an Official Account on the free
          # package, an application that has not registered the API group, a code
          # that was already used or has expired, and a state that belongs to a
          # different authorization.
          '422': { $ref: '#/components/responses/ValidationError' }

  - target: $.paths['/ext/zalo-oa/status']
    update:
      # GET, and it takes no arguments at all: there is one connection per
      # installation, so there is nothing to name.
      get:
        operationId: zaloOaStatus
        summary: Report this installation's Zalo Official Account connection.
        tags: [Extensions]
        x-rbac-object: ext_zalo_oa_connection
        x-rbac-action: read
        x-mcp-tool:
          verb: zalo_oa_status
          version: 1.0.0
          title: Zalo Official Account connection status
          # 🟢 read: it reads one row of the unit's own table and changes nothing.
          tier: auto_execute
          scope: read
          description: >-
            Report whether this installation has a Zalo Official Account
            connected, which account it is, who authorized it, and what the
            scheduled poll last did: how far through the conversations it has
            read, when it last ran, and whether anything is wrong. It never
            returns a token.
        responses:
          '200':
            description: The installation's connection, or the absence of one.
            content:
              application/json:
                schema:
                  type: object
                  additionalProperties: false
                  required: [connected]
                  properties:
                    connected:
                      type: boolean
                      description: >-
                        Whether an Official Account is connected and working. It is false
                        both before anyone connects and while an authorization is part way
                        through, neither of which is an error.
                    connection:
                      # The same connection object the other two operations
                      # return, member for member. See the note on connect.
                      type: object
                      additionalProperties: false
                      required: [id, oa_id, app_id, authorized_by, status, high_water_mark, version,
                        poll_request_budget]
                      description: >-
                        This installation's Zalo connection. It carries no token — the
                        credentials are sealed in the unit's secret namespace and no
                        operation returns them.
                      properties:
                        id: { type: string, format: uuid }
                        oa_id:
                          type: string
                          description: >-
                            Zalo's own id for the connected Official Account, and the
                            namespace every person binding and every captured message key
                            is prefixed with. It is taken from what the credential answers
                            for, never from a request.
                        app_id: { type: string }
                        authorized_by:
                          type: string
                          format: uuid
                          description: >-
                            The administrator who connected the account: whose sealed
                            credential the poll spends, and whose live authority every
                            captured message is landed on.
                        status:
                          type: string
                          enum: [connected, reauth_required, tier_lapsed]
                          description: >-
                            `connected` is working. `reauth_required` means the credential
                            can no longer be renewed and an administrator must connect a
                            fresh token pair. `tier_lapsed` means the credential is fine and
                            the Official Account's package is not.
                        account_label:
                          type: string
                          description: What Zalo says this Official Account is called.
                        package_name:
                          type: string
                          description: >-
                            The Official Account's package, as Zalo names it — shown as
                            evidence and compared against nothing.
                        package_valid_through:
                          type: string
                          description: When that package expires, as Zalo reports it.
                        access_token_expires_at:
                          type: string
                          format: date-time
                          description: When the sealed access token stops being accepted.
                        refresh_claimed_at:
                          type: string
                          format: date-time
                          description: Set while a renewal is in flight.
                        high_water_mark:
                          type: integer
                          format: int64
                          description: >-
                            The newest message this connection has decided about, as a
                            millisecond timestamp.
                        backfill_before:
                          type: integer
                          format: int64
                          description: >-
                            Where a poll that ran out of page budget stopped. Zero means
                            there is no gap.
                        pending_high_water_mark:
                          type: integer
                          format: int64
                          description: >-
                            The newest message decided about above an unread region.
                        backfill_offset:
                          type: integer
                          description: Where in the provider's global walk the unread region began.
                        last_polled_at: { type: string, format: date-time }
                        last_error_class:
                          type: string
                          description: >-
                            What went wrong on the last poll, in this unit's own vocabulary.
                            Zalo's own message is deliberately not carried.
                        version: { type: integer }
                        poll_request_budget:
                          type: integer
                          minimum: 2
                          maximum: 200
                          description: >-
                            How many provider requests one scheduled poll may spend, including the
                            call that re-reads the account. It is a property of the ACCOUNT rather
                            than of the build: an installation with four conversations and one with
                            four hundred need different ceilings. Zalo publishes no per-account rate
                            limit in any response header, so the ceiling can only be chosen, never
                            discovered.
          '401': { $ref: '#/components/responses/Unauthorized' }
          '403': { $ref: '#/components/responses/Forbidden' }

  - target: $.paths['/ext/zalo-oa/disconnect']
    update:
      # DELETE: it removes the connection and the sealed credential behind it.
      # Both together — a row that stayed behind would be a connection the poll
      # skips while the ingress port still reads the deposited credential as
      # consent, because what the port reads is the credential rather than this
      # table.
      delete:
        operationId: zaloOaDisconnect
        summary: Disconnect this installation's Zalo Official Account.
        tags: [Extensions]
        x-rbac-object: ext_zalo_oa_connection
        x-rbac-action: delete
        x-mcp-tool:
          verb: zalo_oa_disconnect
          version: 1.0.0
          title: Disconnect a Zalo Official Account
          # 🟢 write: it deletes the unit's own row and the sealed credential
          # beside it. What was already captured stays — those activities are the
          # CRM's record of conversations that happened.
          tier: auto_execute
          scope: write
          description: >-
            Stop polling this installation's Zalo Official Account and delete the
            credential the authorizing administrator deposited, whoever calls it.
            Replies can no longer be sent on this transport afterwards. Messages
            already captured stay on the timeline — they are the record of
            conversations that happened, not a copy of the account's inbox.
        responses:
          '200':
            description: Whether a connection was removed.
            content:
              application/json:
                schema:
                  type: object
                  additionalProperties: false
                  required: [disconnected]
                  properties:
                    disconnected:
                      type: boolean
                      description: >-
                        True when a connection was removed. False means there was none,
                        which is not an error.
          '401': { $ref: '#/components/responses/Unauthorized' }
          '403': { $ref: '#/components/responses/Forbidden' }
