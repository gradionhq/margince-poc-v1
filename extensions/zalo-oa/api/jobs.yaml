#
# zalo-oa's scheduled pull, declared in the contract the core job kinds live in.
# gen-composition merges it into build/composition/api/jobs.yaml and reads the
# pair back out of the MERGED document, so what the worker registers and what
# this file says cannot disagree.
#
# TWO kinds, not one: a cadenced DISPATCHER that enumerates the live fleet and a
# workspace CHILD that polls one tenant's connection. A kind that both ticks and
# carries a tenant has no honest answer for whose data the tick touched, so the
# generator forbids it.
overlay: 1.0.0
info:
  title: zalo-oa
  version: "1.0.0"
actions:
  - target: $.kinds['ext_zalo_oa_poll_chats']
    update:
      job: poll_chats
      role: dispatcher
      queue: default
      # Two minutes, and for this provider the cadence is a DATA-INTEGRITY
      # setting rather than a freshness one. Zalo drops messages from its API
      # after roughly nine days and there is no webhook and no depth to page to,
      # so a connector that is down for longer loses conversations nothing can
      # recover. Polling often is what keeps the window this connector can fall
      # behind by far smaller than the window the provider keeps.
      cadence: 120s
      # Wide enough for one connection to renew its credential if it must, walk
      # up to six pages, and ingest what it found. The client's own per-request
      # timeout is what keeps one hung provider call from spending all of it.
      timeout: 300s
      # 🟢 write: the tick writes this unit's own connection row, and hands
      # records to core capture through the governed ingress port — which runs on
      # the authorizing administrator's live authority, not on the job's. It
      # cannot be confirm-first (a job has no caller to confirm it) and it cannot
      # be outbound (autonomous outbound authority on a clock), and the job seam
      # refuses both outright.
      #
      # Renewing the credential is not outbound in that sense: it spends this
      # installation's own token at the provider's token endpoint and reaches no
      # third party, exactly as reading the conversations does.
      tier: auto_execute
      scope: write

  - target: $.kinds['ext_zalo_oa_poll_chats_ws']
    update:
      job: poll_chats
      role: worker
      queue: default
      timeout: 300s
      # Small on purpose, like every other fan-out child's: the real retry
      # cadence is the dispatcher's next tick, two minutes away, and a poll that
      # failed on a provider outage gains nothing from three fast retries.
      #
      # It matters more here than usual that this number is small: a retry that
      # arrives while another attempt still holds the renewal lease does no work
      # and reports nothing wrong, which is correct but is not progress.
      max_attempts: 3
      # No tier and no scope: the pair resolves as ONE governed job, so its
      # governance is declared once, on the dispatcher above.
