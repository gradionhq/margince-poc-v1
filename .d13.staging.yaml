# see https://git.nfq.asia/devops/district-13-examples#installing
#
# Margince — D13 STAGING (VPN-only). Deploys from the `staging` branch. Every
# private service applies the office / VPN IP whitelist, so
# margince.staging.gradion.com is unreachable from the public internet.
#
# Topology (all under one host, path-routed by the ingress; longest path wins):
#   api  → /v1 /healthz /readyz /metrics   (cmd/api  — HTTP)
#   web  → /                               (Vite SPA behind nginx)
#   worker                                 (cmd/worker — background, no HTTP)
# Managed infra: postgresql 16 (`database`) + redis 7 (`cache`).
#
# ONE-TIME before the first deploy: create the margince_owner / margince_app
# roles + the margince database on the managed Postgres — see
# scripts/d13/db-bootstrap.sql and docs/reference/d13-deployment.md. The app pod
# holds no superuser credential by design.
contacts:
  - tin.nguyen@gradion.com
  - dung.nguyen@gradion.com

vault:
  enable: true
  force: false

project: margince

services:
  public:
    - name: database
      enable: true
      force: false
      service: postgresql
      details:
        version: 16
        size: 8Gi

    - name: cache
      enable: true
      force: false
      service: redis
      details:
        version: 7

  private:
    # --- Go API server (cmd/api) ---
    - name: api
      enable: true
      d13Version: 1.0.0
      branch:
        - staging
      git_secret: false
      dockerBuild:
        dockerFile: ./Dockerfile.api
      envFile: ./.env
      details:
        enabledDeployment: true
        replicas: 1
        hostname:
          - host: margince.staging.gradion.com
            paths:
              - /v1
              - /healthz
              - /readyz
              - /metrics
        port: 8080
        bodySize: 25m
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 1Gi
        rateLimitRPS: 100
        rateLimitRPM: 3000
        # Liveness is a dumb 200 (a DB outage must not restart-loop the process);
        # readiness gates on every dependency probe (Postgres, Redis, AI). Both
        # hit the pod directly, so the VPN whitelist below never blocks them.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        # VPN-only — staging is not exposed to the public internet.
        whitelists:
          # HCM
          - 115.73.220.227 # Viettel FTTH - DevOps team
          - 103.69.79.39 # Softnet leased line - NFQ Staff
          # DAN
          - 117.2.155.55 # Viettel FTTH - Staff access
          - 103.69.78.50 # Softnet leased line - Staff access
          # GERMANY
          - 87.139.150.234 # Staff and Guest access
          # Egypt
          - 41.38.113.208 # Staff access
          - 41.38.113.202 # Staff access
          - 134.122.91.171 # VPN access

    # --- Web SPA (Vite build behind nginx) ---
    - name: web
      enable: true
      d13Version: 1.0.0
      branch:
        - staging
      git_secret: false
      dockerBuild:
        dockerFile: ./Dockerfile.web
      envFile: ./.env
      details:
        enabledDeployment: true
        hostname:
          - host: margince.staging.gradion.com
            paths:
              - /
        port: 80
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 128Mi
        rateLimitRPS: 100
        rateLimitRPM: 3000
        whitelists:
          # HCM
          - 115.73.220.227 # Viettel FTTH - DevOps team
          - 103.69.79.39 # Softnet leased line - NFQ Staff
          # DAN
          - 117.2.155.55 # Viettel FTTH - Staff access
          - 103.69.78.50 # Softnet leased line - Staff access
          # GERMANY
          - 87.139.150.234 # Staff and Guest access
          # Egypt
          - 41.38.113.208 # Staff access
          - 41.38.113.202 # Staff access
          - 134.122.91.171 # VPN access

    # --- Background worker (cmd/worker — outbox relay, retention, Surface-B AI) ---
    # No HTTP surface, so no ingress and no probes. Outbound mail does not leave
    # without this process (see docs/reference/configuration.md § cmd/worker).
    - name: worker
      enable: true
      d13Version: 1.0.0
      branch:
        - staging
      git_secret: false
      dockerBuild:
        dockerFile: ./Dockerfile.worker
      envFile: ./.env
      details:
        enabledDeployment: true
        replicas: 1
        # SIGTERM → graceful drain: in-flight subscriber handlers finish their ack
        # before exit. The default 30s grace is enough for the relay/runner.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
