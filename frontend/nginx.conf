# SPA static serving. This server only ever sees requests the D13 ingress routed
# to the web service (everything the api owns — /v1, /healthz, /readyz, /metrics
# — is routed to the api service by longest-path match, so it never reaches here).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are content-addressed — cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: every unknown path falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
