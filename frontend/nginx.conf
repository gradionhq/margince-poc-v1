# SPA static serving. This server only ever sees requests the reverse proxy /
# ingress routed to the web service (everything the api owns — /v1, /healthz,
# /readyz, /metrics — is routed to the api service by longest-path match, so it
# never reaches here). Any ingress that path-routes this way works; District 13
# is not a prerequisite.
server {
    # 8080, not 80: the nginx-unprivileged base runs as a non-root user that
    # cannot bind a privileged port. The ingress targets this container port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No referrers leave this origin, ever. The default
    # (strict-origin-when-cross-origin) sends the FULL url on same-origin
    # requests, and the SPA's api calls are same-origin by construction
    # (api/client.ts pins the base to location.origin + /v1) — so any secret a
    # url ever carries would be handed to the api in a header. `always` is
    # required: without it nginx omits the header on error responses, which are
    # exactly the pages a mistyped or expired link lands on.
    #
    # REPEATED in every location that sets an add_header of its own. nginx's
    # add_header does not merge with an inherited one — a location with any
    # add_header REPLACES the whole inherited set — so a policy declared only
    # here would be silently dropped on exactly the asset and shell responses
    # below. This is the one directive where DRY loses to correctness.
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Keep gzipped and identity responses cache-separated in shared caches.
    gzip_vary on;

    # Hashed build assets are content-addressed — cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "no-referrer" always;
    }

    # The app shell must revalidate — otherwise a shared cache can keep serving a
    # stale index.html that points at build assets a new deploy has replaced.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }

    # The MCP App documents. The api fetches these server-side and inlines them
    # into resources/read, so no header here ever reaches a third-party host —
    # the view's effective content-security policy comes from _meta.ui.csp, not
    # from this file. Nothing frame-related belongs here for the same reason.
    #
    # try_files ... =404 is load-bearing: without it the SPA fallback below
    # answers a missing view with index.html and HTTP 200, and the api would
    # fetch the app shell believing it was a view.
    #
    # no-cache, not /assets/'s immutable: these are replaced on deploy and the
    # api's refresh must see new bytes through any shared cache.
    location /mcp-apps/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }

    # Client-side routing: every unknown path falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
