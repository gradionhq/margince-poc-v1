version: "2"

linters:
  default: standard
  enable:
    - depguard
    - forbidigo
    - gosec
    - misspell
    - revive
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # The job-registration door, closed here rather than in
        # .golangci.strict.yml: the strict pass is new-code-only
        # (new-from-merge-base), and every registration site this binds is
        # pre-existing. addDeclaredWorker's type parameter is what makes an
        # undeclared kind unbuildable; any direct registration walks around
        # that constraint, around jobs.Govern (so the worker answers River's
        # option methods for itself again), and around the kind list
        # jobs.MustBeTotal reads at boot.
        #
        # ALL THREE of River's registration spellings, not just AddWorker:
        # AddWorkerArgs and AddWorkerSafely are equally unconstrained and
        # equally direct, and AddWorkerSafely is already idiom in this tree.
        - pattern: '^river\.AddWorker(Args|Safely)?$'
          pkg: '^github\.com/riverqueue/river$'
          msg: "register through addDeclaredWorker — a kind absent from api/jobs.yaml is not in declaredJobArgs, and a direct registration also escapes jobs.Govern and the boot-time totality check"
    depguard:
      rules:
        # Layer B of the boundary stack (ADR-0014 §3): the module DAG from
        # architecture/01, expressed as import denials. Layer A is the Go
        # compiler (internal/); Layer C is go-arch-lint (.go-arch-lint.yml).
        shared-purity:
          files:
            - "**/internal/shared/**"
          # Default-deny: the shared layer (kernel + apperrors + ports) is
          # stdlib + each other + the published extension surface (which
          # sits BELOW shared: ports alias published seam types so a core
          # module and an extension register the same type, ADR-0069 §3) —
          # a new shared package pulling a third-party dep fails HERE, not
          # only in the arch fitness test.
          list-mode: strict
          allow:
            - $gostd
            - github.com/gradionhq/margince/backend/internal/shared
            - github.com/gradionhq/margince/backend/pkg
        # The published extension surface (backend/pkg, ADR-0069 §3) is the
        # outermost Tier-0 leaf: stdlib + itself, nothing else — anything
        # else it imported would become transitively-frozen published API.
        pkg-purity:
          files:
            - "**/backend/pkg/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/gradionhq/margince/backend/pkg
        platform:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/gradionhq/margince/backend/internal/modules
              desc: platform owns no domain module
            - pkg: github.com/gradionhq/margince/backend/internal/compose
              desc: platform never sees the composition layer
        # Sibling isolation ("a module never imports a sibling module",
        # ADR-0054 §9) is NOT spelled here: depguard cannot say "no
        # sibling but your own subpackages are fine" without an N²
        # hand-maintained rule per module, and that list drifted. The
        # invariant is enforced mechanically instead — the tree-derived
        # TestNoSiblingModuleImports in backend/arch_test.go enrolls a
        # new module the moment its directory exists, and go-arch-lint
        # (.go-arch-lint.yml) gates the same DAG per component.
        modules-common:
          files:
            - "**/internal/modules/**"
          deny:
            - pkg: github.com/gradionhq/margince/backend/internal/compose
              desc: modules never see the composition layer
            - pkg: github.com/gradionhq/margince/backend/cmd
              desc: modules never see the process roles
    revive:
      # package-comments stays ON: package docs are onboarding
      # infrastructure (architecture/15) — a missing one fails the gate
      # instead of rotting silently.
      rules:
        - name: package-comments
  exclusions:
    rules:
      # Test files are exempt from gosec's hardcoded-credential heuristic
      # (G101): fitness-test maps key on function names like RotateSecret and
      # unit tests carry obvious fixture secrets — neither is a real
      # credential. Mirrors the strict config's _test.go gosec exemption so
      # the two passes agree (a nolint would read as unused under strict).
      - path: '_test\.go$'
        linters: [gosec]
      # platform/jobs' own suites register fixture kinds against a throwaway
      # river.Workers — kinds api/jobs.yaml will never declare, and no door
      # into a running fleet. Closing that would leave the declaration
      # untestable from outside the contract.
      - path: '_test\.go$'
        linters: [forbidigo]
      # jobregistry.go holds the ONE sanctioned river.AddWorker — the shared
      # body addDeclaredWorker routes into. Excluded by path rather than by a
      # //nolint, because the strict pass enables forbidigo with different
      # patterns and its nolintlint would then read the directive as unused.
      - path: 'internal/compose/jobregistry\.go$'
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
