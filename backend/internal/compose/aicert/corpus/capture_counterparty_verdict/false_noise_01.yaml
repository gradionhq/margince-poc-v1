name: real_prospect_must_not_be_noise
task: capture_counterparty_verdict
site: verdict
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
fixture:
  display_name: Priya Raman
  email: p.raman@northwind-logistics.example
  subject: quote for 3 pallets weekly, Rotterdam - Lyon
  body: |
    hi, got your name from a colleague. we ship about 3 pallets a week rotterdam to
    lyon and our current forwarder keeps missing the tuesday cutoff. can you do
    recurring lanes? what would that cost roughly. we'd want to start next month.

    priya
expect:
  outcome: accepted
  answer: real
  rubric: >
    This is the release-blocking false-noise case (ADR-0072/A118 §4). The sender
    is an unmistakable inbound prospect: a named human, a specific commercial
    need, a stated timeline, and a request for a quote. The message is lowercase
    and unpolished, which is exactly the trap — informality is not noise.
    A verdict of "real" scores high. A verdict of "noise" is the failure this
    scenario exists to catch and scores zero regardless of stated confidence,
    because above the 0.7 floor it would hide a genuine prospect's first mail.
    A "real" verdict below the floor scores in the middle: abstaining is safe
    but costs a human the review.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
