name: bulk_marketing_is_noise
task: capture_counterparty_verdict
site: verdict
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
fixture:
  display_name: SaaSWeekly Digest
  email: digest@mail.saasweekly.example
  subject: "\U0001F680 10 growth hacks your competitors are already using"
  body: |
    Hi there! This week: the 10 tactics top teams use to 3x pipeline.
    Plus: our Black Friday deal ends Friday — 40% off all annual plans.

    You're receiving this because you downloaded a whitepaper.
    Unsubscribe | Manage preferences | View in browser
expect:
  outcome: accepted
  answer: noise
  rubric: >
    A bulk marketing send with every mass-mail marker present: a digest sender
    address, promotional subject, a list-membership explanation and unsubscribe
    footer. Nobody at this business has a relationship with the sender.
    A verdict of "noise" scores high. A verdict of "real" scores low — it is the
    junk-record outcome ADR-0072 exists to prevent, though it is the SAFE
    direction of error: a wrongly created record is visible and deletable, where
    a wrongly hidden prospect is neither.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
