name: js_only_page_yields_no_fabrication
task: site_extract
site: profile
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
# One crawled page that reduced to a JS-only loading shell. The fixture holds
# the text the crawler left behind, not the markup it stripped: the excerpt
# budget, the passage numbering, the per-call schema enum and the citation gate
# are all derived from this text by the deep read itself.
fixture:
  pages:
    - url: https://loadingshell.test/
      kind: home
      text: Loading… Please enable JavaScript to view this site.
expect:
  # The right answer here is silence, and silence is an answer: the lane stores
  # no profile field and the deep read carries on. A reply that grounds a field
  # anyway is graded by which failure it is — one the citation gate refuses is
  # invalid, one that survives it is a wrong answer naming the field invented.
  outcome: abstained
  answer:
    not_grounded:
      - display_name
      - offer_summary
      - icp
      - value_proposition
      - usp
      - customer_pains
      - desired_outcomes
      - buying_center
      - buying_intents
      - common_objections
      - sales_motion
      - legal_name
      - registered_address
      - register_vat
      - industry
      - history
  rubric: >
    This site's one crawled page reduced to a JS-only loading shell — one
    passage (s0) that states nothing a CRM could use: no company name, no
    ICP, no legal notice, nothing. Score high only if the fields array is
    empty; any populated field here is a pure fabrication (there is no
    passage to have grounded it in) and must score at the floor however
    plausible the invented value sounds.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
