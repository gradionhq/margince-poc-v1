name: home_page_profile_fields_grounded
task: site_extract
site: profile
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
# The fixture holds the crawl, not the prompt: the excerpt budget, the passage
# numbering, the per-call schema enum and the citation gate are all derived from
# these pages by the deep read itself, so a scenario cannot pin a passage id.
fixture:
  pages:
    - url: https://kestrelfold.test/
      kind: home
      text: |
        Kestrel Fold Kestrel Fold builds inventory-forecasting software for mid-market grocery chains running 20-200 stores. Founded in 2016, we help operations teams cut overstock write-offs without hiring a data-science team.

        What makes us different: our forecasts run on the point-of-sale data grocers already have, with no new hardware and no new POS integration. Buying signal we look for: a chain that just missed a seasonal demand spike and is actively comparing forecasting vendors.
expect:
  outcome: accepted
  answer:
    display_name: Kestrel Fold
  rubric: >
    This one-page corpus carries two passages: the company's identity
    ("Kestrel Fold", the 20-200-store grocery ICP, the 2016 founding year) and
    the USP — forecasts run on existing POS data with no new hardware — plus the
    buying-intent signal, a chain that just missed a seasonal demand spike.
    Score how many of display_name, icp, history (all groundable in the first
    passage) and usp, buying_intents (groundable in the second) were proposed
    with the RIGHT citing passage id and a value drawn from that passage's own
    words, and penalize any field this page does not state (buying_center,
    industry, or any of the legal trio — this page is not a legal notice and
    names no registered entity).
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
