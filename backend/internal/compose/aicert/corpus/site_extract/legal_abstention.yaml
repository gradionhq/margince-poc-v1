name: one_legal_page_naming_two_entities
task: site_extract
site: profile
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
# The two conflicting entities sit on ONE legal notice, which is the only way
# this lane can ever be shown them: profileExcerptPages represents at most one
# impressum page in the profile's excerpt corpus, so a crawl carrying two would
# reach the model as one and the conflict would never be in the prompt. A site
# that publishes a group holding beside its operating company on the same
# imprint is what that conflict actually looks like from here.
fixture:
  pages:
    - url: https://kestrelfold.test/impressum
      kind: impressum
      text: |
        Impressum

        Kestrel Fold Consulting GmbH, Hafenstrasse 12, 20457 Hamburg, Germany. Registered: Amtsgericht Hamburg, HRB 998877. VAT: DE334455667.

        This site is operated by Kestrel Fold Holdings Pte Ltd, 8 Marina View, Singapore 018960. Company registration number 201899887K.
expect:
  # Withholding all three is the answer, and the negative claim is what names
  # the fabrication: a model that picks one of the two entities grounds a legal
  # name the passage genuinely contains, so the citation gate lets it through
  # and only this expectation can call it wrong — by name, and with the entity
  # it chose, which is what a reviewer needs to see.
  outcome: abstained
  answer:
    not_grounded:
      - legal_name
      - registered_address
      - register_vat
  rubric: >
    This site's legal notice names two DIFFERENT legal entities — Kestrel
    Fold Consulting GmbH (Hamburg) and Kestrel Fold Holdings Pte Ltd
    (Singapore). The profile prompt is explicit that legal_name,
    registered_address and register_vat may ONLY be proposed when the site's
    legal pages name exactly one entity — here they name two, so the only
    correct answer withholds all three. No other profile field is stated on
    this passage either: it is an imprint, not a description of what the
    company sells or whom it serves. Picking either entity confidently, or
    grounding any non-legal field this passage does not state, is a wrong
    answer, not a partial-credit one.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
