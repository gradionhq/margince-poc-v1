name: services_page_offering_facts
task: site_fact_extract
site: page_facts
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
# The page's KIND is not decoration: it selects the menu, and the menu is half
# the prompt and half the schema enum together. A services page is asked for
# offering, market and technology facts and for nothing else.
fixture:
  url: https://kestrelfold.test/services
  kind: services
  text: |
    What we offer Demand Forecasting — weekly SKU-level forecasts fed straight into your existing point-of-sale system. Overstock Advisor — a product that flags slow-moving inventory before markdown season begins. Our platform runs on AWS and integrates with Snowflake for warehouse-level data sync.
expect:
  outcome: accepted
  answer:
    service: Demand Forecasting
    product: Overstock Advisor
    technology: AWS
  rubric: >
    This one-page call's whole page reduced to a single passage naming
    four distinct items: the "Demand Forecasting" service, the "Overstock
    Advisor" product, and two technologies the platform runs on/integrates
    with — AWS and Snowflake. Score how many of the four were extracted with
    the right field and a value whose name appears in the passage. The field is
    a schema enum holding this kind's whole menu — service, product,
    capability, served_industry, company_size, geography, language, technology
    — so a field outside it cannot be generated and the mis-filings worth
    grading are the ones inside it: AWS or Snowflake returned as a capability
    or a service rather than a technology, or the forecasting service as a
    product, is the wrong field on a right value. Penalize that, and penalize
    any item this page does not state — a served_industry or a geography read
    into a passage that names neither is invented, not extracted.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
