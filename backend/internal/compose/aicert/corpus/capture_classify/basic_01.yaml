name: meeting_request_from_reply
task: capture_classify
site: classify
source: hand_authored
sanitized_by: hand_authored/claude-fable-5
fixture:
  - subject: 'Re: pricing walkthrough'
    body: |
      Hi Jana, thanks for the deck. Could we grab 30 minutes Thursday afternoon
      to walk through the tiers together? I'm free after 2pm CET.

      Best,
      Marco
expect:
  outcome: accepted
  answer: [meeting]
  rubric: >
    This site answers with {id, label, confidence} per message and nothing
    else, the label drawn from the closed set commitment | meeting | noise.
    Score the label first: the mail asks for thirty minutes on Thursday
    afternoon and offers a time, which is scheduling and nothing more, so
    "meeting" is right — the tie-break that prefers commitment when a message
    is both does not fire here, and "noise" is wrong on a mail that names a
    slot. Then score the confidence as a real judgement rather than a
    formality, because production spends on it: every message left under the
    0.7 floor is re-asked alone on the next rung of the routing ladder, and
    every label at or above it is applied unexamined. So a correct label held
    confidently scores highest; a correct one hedged below the floor scores
    lower, since it buys a second call it did not need; a wrong label scores
    low, and lowest when it is asserted confidently enough to be applied.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
