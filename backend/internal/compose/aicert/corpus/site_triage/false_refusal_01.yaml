    client history, and prints a registered legal entity. "company" scores high.
    "personal" scores VERY low: this is the false-refusal direction, where a real
    customer silently loses their organization record and no one sees it happen.
    This scenario is release-blocking for that reason, in the way false_noise_01
    is for the counterparty verdict.
