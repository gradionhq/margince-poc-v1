name: pdf_agreement_read_as_a_document_part
task: document_extract
site: fields
source: hand_authored
sanitized_by: hand_authored/claude-opus-5
# The BYTES lane (RD-PARAM-N-4): the file goes to the model as an input part,
# not as text this build extracted. It is the lane the issue's headline cases
# take and the one the text lane's verbatim quote check cannot reach
# (RD-AC-N-4) — grounding here is held by the prompt and by this rubric, and
# certifying only the text lane would certify the easier half.
#
# The fixture is a generated PDF rather than a photographed page. It is honest
# about what it exercises: the attachment part reaching a model and being read
# off the page layout, not optical recognition of a camera image. A binding
# that cannot carry application/pdf never reaches this scenario at all — the
# case refuses a media type no adapter accepts before any call is made.
fixture:
  filename: mcc-2026-0442-service-agreement.pdf
  mime: application/pdf
  # One line, unwrapped: a folded scalar would join the parts with spaces and
  # a wrapped one would keep the newlines, and base64 admits neither.
  bytes: 
expect:
  outcome: accepted
  answer:
    name: Cold Chain Monitoring, Rostock depot
    amount_minor: "8740000"
    currency: EUR
    expected_close_date: "2027-03-15"
  rubric: >
    A service agreement laid out as a real document: a letterhead, numbered
    sections, a charges block and two dates. Score whether the reading located
    each value on the page and read it correctly.

    The charges block is the first judgement. "EUR 87,400.00" is the annual
    service charge and the only money on the page; the other two lines carry
    no figure at all. Report the printed figure and let the product scale it
    to minor units — a reading that reports 87400 has understated the
    agreement a hundredfold, which is the error a page of numbers makes
    easiest and a reviewer catches least.

    The dates are the second. The document carries an issue date (3 November
    2026) and a target cutover (15 March 2027), and it says explicitly that
    charges begin on cutover rather than on signature. The cutover is when
    this piece of business is expected to close. The twenty-four month term
    and the three months' notice are durations, not dates, and a reading that
    turns either into an expected close date has computed a date the document
    does not state.

    The name is what the agreement is FOR — the service and its site — not the
    supplier on the letterhead, not the customer, and not the agreement
    number, all three of which sit within a few lines of it.

    Because this is the bytes lane, quotes cannot be checked against a text
    layer by the product. Judge them yourself: a quote should be text that
    actually appears on the page, copied rather than reworded, and the
    page_or_section should name where — a section number or heading a reader
    could turn to. A confident value whose quote is a paraphrase of the page
    is the failure this lane exists to be watched for.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
