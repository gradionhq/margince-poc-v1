name: fx_rates_two_pairs_grounded
task: rate_extract
site: fx
source: hand_authored
sanitized_by: hand_authored/claude-opus-4-8
# The expected rates are what the SHEET stores: one unit of the foreign currency
# in the workspace base. The page states the opposite direction and the prompt
# forbids the model any arithmetic, so a correct read is the page's direction
# reported intact and inverted by fxAnchor — never converted by the model.
fixture:
  base_currency: EUR
  tracked_currencies: [USD, GBP]
  page_text: |
    Base currency EUR. 1 EUR = 1.0800 USD as of today.
    1 EUR = 0.8500 GBP, mid-market.
expect:
  outcome: accepted
  answer:
    USD: '0.9259259259'
    GBP: '1.1764705882'
  rubric: >
    This rates page states two pairs, both anchored on EUR. The first passage
    grounds 1 EUR = 1.08 USD; the second grounds 1 EUR = 0.85 GBP. Score how
    faithfully the two pairs are extracted VERBATIM in the direction the page
    shows (from EUR), with the RIGHT citing passage id and the rate as a plain
    decimal string (not a range, not a number, not a currency symbol) — the
    model must NOT invert or convert. confidence must be a decimal string within
    0.0-1.0. Penalize any invented pair, an inverted or converted rate, an
    out-of-range confidence, or a rate not drawn from the cited passage.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
