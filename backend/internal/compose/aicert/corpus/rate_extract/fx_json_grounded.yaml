name: fx_rates_json_api_grounded
task: rate_extract
site: fx
source: hand_authored
sanitized_by: hand_authored/claude-opus-4-8
# The default fx_source (api.frankfurter.dev/v1/latest) is read as page text,
# not parsed JSON, so the extractor must ground a single-passage JSON body too.
fixture:
  base_currency: EUR
  tracked_currencies: [USD, GBP]
  page_text: |
    {"amount":1.0,"base":"EUR","date":"2026-07-22","rates":{"USD":1.08,"GBP":0.86}}
expect:
  outcome: accepted
  answer:
    USD: '0.9259259259'
    GBP: '1.1627906977'
  rubric: >
    This is a Frankfurter-style rates JSON body on one passage: base EUR, so
    "rates" maps 1 EUR to each listed currency — 1 EUR = 1.08 USD and
    1 EUR = 0.86 GBP. Score how faithfully the two pairs are extracted in the
    direction the JSON states (from EUR), each citing that one passage, with the
    rate as the plain decimal string drawn from the body (not inverted, not
    converted, no currency symbol). confidence must be a decimal string within
    0.0-1.0. Penalize an inverted or converted rate, an invented pair, an
    out-of-range confidence, or a rate not present in the body.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
