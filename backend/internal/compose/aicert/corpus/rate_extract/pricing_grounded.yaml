name: pricing_table_two_models_grounded
task: rate_extract
site: pricing
source: hand_authored
sanitized_by: hand_authored/claude-opus-4-8
# The fixture holds the page as the fetch returns it: no passage numbers, no
# page header. numberPassages adds [s0], [s1] … and the fence wraps them, both
# inside the request rate_extract itself builds.
fixture:
  provider: Aurora AI
  page_text: |
    Aurora AI — Aurora Large (model id: aurora-large), our flagship model. Input $5.00 / 1M tokens, output $25.00 / 1M tokens. Prompt caching: cache reads $0.50 / 1M, cache writes $6.25 / 1M.
    Aurora AI — Aurora Mini (model id: aurora-mini), fast and cheap. Input $0.25 / 1M tokens, output $1.50 / 1M tokens. Prompt caching is not available on this model.
expect:
  outcome: accepted
  answer:
    aurora-large:
      input_per_mtok: '5'
      output_per_mtok: '25'
      cache_read_per_mtok: '0.5'
      cache_write_per_mtok: '6.25'
    aurora-mini:
      input_per_mtok: '0.25'
      output_per_mtok: '1.5'
      cache_read_per_mtok: '0'
      cache_write_per_mtok: '0'
  rubric: >
    This pricing page states two models, both from the provider Aurora AI named
    in each passage. The first passage grounds aurora-large at input 5, output
    25, cache-read 0.5, cache-write 6.25; the second grounds aurora-mini at
    input 0.25, output 1.5, and states caching is unavailable, so its cache
    buckets are 0. Score how faithfully the two models are extracted with the
    RIGHT citing passage id and prices drawn from that passage as plain per-MTok
    decimal strings (not ranges, not numbers, not currency symbols). The
    provider must be Aurora AI, drawn from the passage — penalize an invented
    provider. confidence must be a decimal string within 0.0–1.0. Penalize any
    invented model, price, an out-of-range confidence, or a caching price for
    aurora-mini that the page says has none.
  bands:
    certified_min: 70
    degraded_min: 50
    floor: 40
